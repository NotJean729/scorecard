}

function AnnualGoalEditorCard({ goal, deptEmployees, getMonthView, commitCurrentMonthEdit, scheduleFutureVersion, updateGoal, archiveGoal, restoreGoal, notify }) {
  const cur = currentIsoMonth();
  const [activeMonth, setActiveMonth] = useState(cur);
  const view = getMonthView(goal, activeMonth);
  const isLive = view.status === "live";
  const isPast = view.status === "past" || view.status === "past-empty";
  const readOnly = isPast;

  const [draftTasks, setDraftTasks] = useState(view.tasks);
  const [draftAssigned, setDraftAssigned] = useState(view.assignedEmployeeIds);
  const [dirty, setDirty] = useState(false);
  const [showScopeModal, setShowScopeModal] = useState(false);
  const [showAssign, setShowAssign] = useState(false);
  const [search, setSearch] = useState("");
  const [draftText, setDraftText] = useState("");
  const [draftWeight, setDraftWeight] = useState(10);
  const [draftReqAttach, setDraftReqAttach] = useState(false);
  const [draftReqRemark, setDraftReqRemark] = useState(false);

  useEffect(() => {
    const v = getMonthView(goal, activeMonth);
    setDraftTasks(v.tasks);
    setDraftAssigned(v.assignedEmployeeIds);
    setDirty(false);
    setShowScopeModal(false);
  }, [activeMonth]);

  const filtered = deptEmployees.filter((e) => e.name.toLowerCase().includes(search.toLowerCase()));
  const sum = draftTasks.reduce((a, t) => a + Number(t.weight || 0), 0);

  const updateDraftTask = (taskId, patch) => { setDraftTasks((prev) => prev.map((t) => t.id === taskId ? { ...t, ...patch } : t)); setDirty(true); };
  const removeDraftTask = (taskId) => { setDraftTasks((prev) => prev.filter((t) => t.id !== taskId)); setDirty(true); };
  const addDraftTask = () => {
    if (!draftText.trim()) return;
    setDraftTasks((prev) => [...prev, { id: nextId("task"), text: draftText.trim(), weight: draftWeight, requiresAttachment: draftReqAttach, requiresRemark: draftReqRemark }]);
    setDraftText(""); setDraftWeight(10); setDraftReqAttach(false); setDraftReqRemark(false);
    setDirty(true);
  };
  const toggleDraftAssign = (empId) => {
    setDraftAssigned((prev) => prev.includes(empId) ? prev.filter((id) => id !== empId) : [...prev, empId]);
    setDirty(true);
  };

  const handleSave = () => {
    if (isLive) { setShowScopeModal(true); return; }
    scheduleFutureVersion(goal.id, activeMonth, draftTasks, draftAssigned);
    setDirty(false);
  };
  const confirmScope = (scope) => {
    commitCurrentMonthEdit(goal.id, draftTasks, draftAssigned, scope);
    setShowScopeModal(false);
    setDirty(false);
  };
  const discardDraft = () => {
    setDraftTasks(view.tasks);
    setDraftAssigned(view.assignedEmployeeIds);
    setDirty(false);
  };

  return (
    <div className={`bg-white rounded-xl border p-5 ${goal.active === false ? "border-slate-100 opacity-60" : "border-slate-200"}`}>
      <div className="flex items-center justify-between gap-3 mb-1">
        <div className="flex items-center gap-1.5">
          <Star size={13} className="text-amber-500 fill-amber-500" />
          <p className="font-display font-semibold text-sm">{goal.name}{goal.active === false && <span className="ml-2 text-[11px] font-normal text-slate-400">(archived)</span>}</p>
        </div>
        <div className="flex items-center gap-3 shrink-0">
          <span className="flex items-center gap-1 text-[11px] font-medium text-slate-500">
            <Calendar size={11} />
            Due date: {fmtDMY(endOfMonth(activeMonth))}
          </span>
          {goal.active === false ? (
            <button onClick={() => { restoreGoal(goal.id); notify(`Restored "${goal.name}"`); }} title="Restore goal" className="p-1.5 rounded-md text-emerald-600 hover:bg-emerald-50"><Undo2 size={14} /></button>
          ) : (
            <button onClick={() => { archiveGoal(goal.id); notify(`Archived "${goal.name}"`); }} title="Archive goal" className="p-1.5 rounded-md text-slate-300 hover:bg-rose-50 hover:text-rose-500"><Trash2 size={14} /></button>
          )}
        </div>
      </div>
      <p className="text-xs text-slate-400 mb-3">{goal.description} · Annual goal, repeats monthly{goal.autoAssignWholeDept ? " · locked to whole department" : ""}</p>

      <div className="grid grid-cols-2 gap-2 mb-3 max-w-sm">
        <div>
          <label className="text-[11px] text-slate-400">Range start</label>
          <input type="date" value={goal.startDate} onChange={(e) => updateGoal(goal.id, { startDate: e.target.value })} className="w-full px-2 py-1.5 rounded-md border border-slate-200 text-xs" />
          <p className="text-[10px] text-slate-400 mt-0.5">{fmtDMY(goal.startDate)}</p>
        </div>
        <div>
          <label className="text-[11px] text-slate-400">Range end</label>
          <input type="date" value={goal.endDate} onChange={(e) => updateGoal(goal.id, { endDate: e.target.value })} className="w-full px-2 py-1.5 rounded-md border border-slate-200 text-xs" />
          <p className="text-[10px] text-slate-400 mt-0.5">{fmtDMY(goal.endDate)}</p>
        </div>
      </div>

      <div className="flex gap-1 overflow-x-auto pb-2 mb-3 -mx-1 px-1">
        {monthsInRange(goal.startDate, goal.endDate).map((m) => {
          const mv = getMonthView(goal, m);
          const active = m === activeMonth;
          const isPastM = m < cur;
          const isCurM = m === cur;
          return (
            <button
              key={m} onClick={() => setActiveMonth(m)}
              className={`shrink-0 px-2.5 py-1.5 rounded-md text-xs font-medium transition-colors ${
                active ? "bg-slate-900 text-white" : isCurM ? "bg-teal-50 text-teal-700 ring-1 ring-teal-200" : isPastM ? "text-slate-400 hover:bg-slate-50" : mv.status === "scheduled" ? "bg-amber-50 text-amber-700" : "text-slate-500 hover:bg-slate-50"
              }`}
            >
              {monthShortLabel(m)}
            </button>
          );
        })}
      </div>

      {isLive && <p className="text-[11px] text-teal-700 bg-teal-50 rounded-md px-2.5 py-1.5 mb-3 inline-block">Live — this is the current month, in progress right now</p>}
      {isPast && <p className="text-[11px] text-slate-400 bg-slate-50 rounded-md px-2.5 py-1.5 mb-3 inline-block">Past month — locked, view only</p>}
      {!isLive && !isPast && view.status === "scheduled" && <p className="text-[11px] text-amber-700 bg-amber-50 rounded-md px-2.5 py-1.5 mb-3 inline-block">Scheduled change — will take effect {monthLabel(activeMonth)}</p>}
      {!isLive && !isPast && view.status === "inherited" && <p className="text-[11px] text-slate-400 bg-slate-50 rounded-md px-2.5 py-1.5 mb-3 inline-block">No changes scheduled yet — currently inherits the live definition</p>}

      {readOnly ? (
        <div className="space-y-1.5 mb-3">
          {draftTasks.length === 0 && <p className="text-xs text-slate-400">No record for this month.</p>}
          {draftTasks.map((t) => {
            const empDone = draftAssigned.filter((empId) => view.records?.[empId]?.[t.id]?.approval === "approved").length;
            return (
              <div key={t.id} className="flex items-center justify-between bg-slate-50 rounded-lg px-3 py-2 text-sm">
                <span className="text-slate-600">{t.text}</span>
                <span className="font-mono text-xs text-slate-400">{t.weight} pts · {empDone}/{draftAssigned.length} approved</span>
              </div>
            );
          })}
        </div>
      ) : (
        <>
          <div className="flex items-center justify-between mb-2 text-xs font-medium text-slate-500">
            <span>Total points assigned</span>
            <span className="font-mono text-slate-700">{sum} pts</span>
          </div>
          <div className="space-y-1.5 mb-3">
            {draftTasks.map((t) => (
              <div key={t.id} className="flex items-center gap-2 bg-slate-50 rounded-lg px-3 py-1.5">
                <Pencil size={11} className="text-slate-300 shrink-0" />
                <input value={t.text} onChange={(e) => updateDraftTask(t.id, { text: e.target.value })} className="flex-1 text-sm text-slate-700 bg-transparent focus:outline-none" />
                <label className="flex items-center gap-1 text-[10px] text-slate-500 shrink-0">
                  <input type="checkbox" checked={!!t.requiresAttachment} onChange={(e) => updateDraftTask(t.id, { requiresAttachment: e.target.checked })} className="accent-teal-600" />
                  Attachment
                </label>
                <label className="flex items-center gap-1 text-[10px] text-slate-500 shrink-0">
                  <input type="checkbox" checked={!!t.requiresRemark} onChange={(e) => updateDraftTask(t.id, { requiresRemark: e.target.checked })} className="accent-teal-600" />
                  Remark
                </label>
                <input type="number" value={t.weight} onChange={(e) => updateDraftTask(t.id, { weight: Number(e.target.value) })} className="w-14 text-center font-mono text-xs px-1.5 py-1 rounded-md border border-slate-200" />
                <button onClick={() => removeDraftTask(t.id)} className="text-slate-300 hover:text-rose-500"><Trash2 size={13} /></button>
              </div>
            ))}
          </div>
          <div className="flex gap-2 mb-4 items-center">
            <input value={draftText} onChange={(e) => setDraftText(e.target.value)} placeholder="New task…" className="flex-1 px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs" />
            <label className="flex items-center gap-1 text-[10px] text-slate-500 shrink-0">
              <input type="checkbox" checked={draftReqAttach} onChange={(e) => setDraftReqAttach(e.target.checked)} className="accent-teal-600" />
              Attachment
            </label>
            <label className="flex items-center gap-1 text-[10px] text-slate-500 shrink-0">
              <input type="checkbox" checked={draftReqRemark} onChange={(e) => setDraftReqRemark(e.target.checked)} className="accent-teal-600" />
              Remark
            </label>
            <input type="number" value={draftWeight} onChange={(e) => setDraftWeight(Number(e.target.value))} className="w-16 px-2 py-1.5 rounded-lg border border-slate-200 text-xs text-center" />
            <button onClick={addDraftTask} className="px-2.5 py-1.5 rounded-lg bg-slate-900 text-white text-xs font-medium">Add</button>
          </div>

          <button onClick={() => setShowAssign((s) => !s)} className="text-xs font-medium text-teal-700 hover:underline mb-2">
            {draftAssigned.length} assigned this month — manage assignment
          </button>
          {showAssign && (
            <div className="border border-slate-200 rounded-lg p-3 mb-3">
              <div className="flex items-center gap-2 mb-2 bg-slate-50 rounded-md px-2 py-1.5">
                <Search size={13} className="text-slate-400" />
                <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search by name…" className="bg-transparent text-xs flex-1 focus:outline-none" />
              </div>
              <div className="grid grid-cols-2 gap-1.5 max-h-48 overflow-y-auto">
                {filtered.map((e) => {
                  const checked = draftAssigned.includes(e.id);
                  return (
                    <label key={e.id} className={`flex items-center gap-1.5 text-xs px-2 py-1.5 rounded-md cursor-pointer ${checked ? "bg-teal-50 text-teal-700" : "text-slate-600 hover:bg-slate-50"}`}>
                      <input type="checkbox" checked={checked} onChange={() => toggleDraftAssign(e.id)} className="accent-teal-600" />
                      {e.name}
                    </label>
                  );
                })}
              </div>
            </div>
          )}

          {dirty && (
            <div className="flex gap-2 border-t border-slate-100 pt-3">
              <button onClick={handleSave} className="px-4 py-2 rounded-lg bg-slate-900 text-white text-sm font-medium">Save changes</button>
              <button onClick={discardDraft} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium">Discard</button>
            </div>
          )}
        </>
      )}

      {showScopeModal && (
        <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-30 p-6" onClick={() => setShowScopeModal(false)}>
          <div className="bg-white rounded-xl max-w-md w-full p-6" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center gap-2 mb-2">
              <AlertTriangle size={18} className="text-amber-500" />
              <p className="font-display font-semibold">Update goal — {monthLabel(cur)}</p>
            </div>
            <p className="text-sm text-slate-500 mb-4">This month is already in progress. Choose how far this change should apply. Staff whose tasks change will be notified.</p>
            <div className="space-y-2">
              <button onClick={() => confirmScope("current")} className="w-full text-left px-4 py-2.5 rounded-lg border border-slate-200 hover:border-teal-300 hover:bg-teal-50 transition-colors">
                <p className="text-sm font-medium">Edit current month only</p>
                <p className="text-xs text-slate-400">Reverts back to the old setup automatically next month</p>
              </button>
              <button onClick={() => confirmScope("currentAndFuture")} className="w-full text-left px-4 py-2.5 rounded-lg border border-slate-200 hover:border-teal-300 hover:bg-teal-50 transition-colors">
                <p className="text-sm font-medium">Edit current & every future month</p>
                <p className="text-xs text-slate-400">Applies now and stays this way until changed again</p>
              </button>
              <button onClick={() => setShowScopeModal(false)} className="w-full text-center px-4 py-2 rounded-lg text-slate-500 text-sm">Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function GoalEditorCard({ goal, deptEmployees, updateGoal, archiveGoal, restoreGoal, addTaskToGoal, removeTaskFromGoal, updateTaskWeight, updateTaskRequiresAttachment, updateTaskRequiresRemark, updateTaskText, toggleAssignment, notify }) {
  const [draftText, setDraftText] = useState("");
  const [draftWeight, setDraftWeight] = useState(10);
  const [draftRequiresAttachment, setDraftRequiresAttachment] = useState(false);
  const [draftRequiresRemark, setDraftRequiresRemark] = useState(false);
  const [showAssign, setShowAssign] = useState(false);
  const [search, setSearch] = useState("");
  const sum = goal.tasks.reduce((a, t) => a + Number(t.weight || 0), 0);
  const filtered = deptEmployees.filter((e) => e.name.toLowerCase().includes(search.toLowerCase()));

  const handleToggleAssignment = (emp) => {
    const wasAssigned = goal.assignedEmployeeIds.includes(emp.id);
    toggleAssignment(goal.id, emp.id);
    notify(wasAssigned ? `Removed ${emp.name} from "${goal.name}"` : `Added ${emp.name} to "${goal.name}"`);
  };

  return (
    <div className={`bg-white rounded-xl border p-5 ${goal.active === false ? "border-slate-100 opacity-60" : "border-slate-200"}`}>
      <div className="flex items-start justify-between mb-1">
        <div className="flex items-center gap-1.5">
          {goal.isTeamGoal && <Star size={13} className="text-amber-500 fill-amber-500" />}
          <input value={goal.name} onChange={(e) => updateGoal(goal.id, { name: e.target.value })} className="font-display font-semibold text-sm bg-transparent focus:outline-none focus:ring-1 focus:ring-teal-600 rounded px-1" />
          {goal.active === false && <span className="text-[11px] font-normal text-slate-400">(archived)</span>}
        </div>
        {goal.active === false ? (
          <button onClick={() => { restoreGoal(goal.id); notify(`Restored "${goal.name}"`); }} title="Restore goal" className="text-emerald-600 hover:bg-emerald-50 p-1 rounded-md"><Undo2 size={15} /></button>
        ) : (
          <button onClick={() => { archiveGoal(goal.id); notify(`Archived "${goal.name}"`); }} title="Archive goal" className="text-slate-300 hover:text-rose-500 hover:bg-rose-50 p-1 rounded-md"><Trash2 size={15} /></button>
        )}
      </div>
      <input value={goal.description} onChange={(e) => updateGoal(goal.id, { description: e.target.value })} className="text-xs text-slate-400 bg-transparent focus:outline-none w-full mb-3" />

      <div className="grid grid-cols-3 gap-2 mb-3">
        <div>
          <label className="text-[11px] text-slate-400">Staff start date</label>
          <input type="date" value={goal.startDate} onChange={(e) => updateGoal(goal.id, { startDate: e.target.value })} className="w-full px-2 py-1.5 rounded-md border border-slate-200 text-xs" />
          <p className="text-[10px] text-slate-400 mt-0.5">{fmtDMY(goal.startDate)}</p>
        </div>
        <div>
          <label className="text-[11px] text-slate-400">Staff cut-off (due)</label>
          <input type="date" value={goal.endDate} onChange={(e) => updateGoal(goal.id, { endDate: e.target.value })} className="w-full px-2 py-1.5 rounded-md border border-slate-200 text-xs" />
          <p className="text-[10px] text-slate-400 mt-0.5">{fmtDMY(goal.endDate)}</p>
        </div>
        <div>
          <label className="text-[11px] text-slate-400">Management review cut-off</label>
          <input type="date" value={goal.reviewCutoffDate || goal.endDate} onChange={(e) => updateGoal(goal.id, { reviewCutoffDate: e.target.value })} className="w-full px-2 py-1.5 rounded-md border border-slate-200 text-xs" />
          <p className="text-[10px] text-slate-400 mt-0.5">{fmtDMY(goal.reviewCutoffDate || goal.endDate)}</p>
        </div>
      </div>

      <div className="flex items-center justify-between mb-2 text-xs font-medium text-slate-500">
        <span>Total points assigned</span>
        <span className="font-mono text-slate-700">{sum} pts</span>
      </div>
      <div className="space-y-1.5 mb-3">
        {goal.tasks.map((t) => (
          <div key={t.id} className="flex items-center gap-2 bg-slate-50 rounded-lg px-3 py-1.5">
            <Pencil size={11} className="text-slate-300 shrink-0" />
            <input value={t.text} onChange={(e) => updateTaskText(goal.id, t.id, e.target.value)} className="flex-1 text-sm text-slate-700 bg-transparent focus:outline-none" />
            <label className="flex items-center gap-1 text-[10px] text-slate-500 shrink-0">
              <input type="checkbox" checked={!!t.requiresAttachment} onChange={(e) => updateTaskRequiresAttachment(goal.id, t.id, e.target.checked)} className="accent-teal-600" />
              Attachment
            </label>
            <label className="flex items-center gap-1 text-[10px] text-slate-500 shrink-0">
              <input type="checkbox" checked={!!t.requiresRemark} onChange={(e) => updateTaskRequiresRemark(goal.id, t.id, e.target.checked)} className="accent-teal-600" />
              Remark
            </label>
            <input type="number" value={t.weight} onChange={(e) => updateTaskWeight(goal.id, t.id, Number(e.target.value))} className="w-14 text-center font-mono text-xs px-1.5 py-1 rounded-md border border-slate-200" />
            <button onClick={() => removeTaskFromGoal(goal.id, t.id)} className="text-slate-300 hover:text-rose-500"><Trash2 size={13} /></button>
          </div>
        ))}
      </div>
      <div className="flex gap-2 mb-4 items-center">
        <input value={draftText} onChange={(e) => setDraftText(e.target.value)} placeholder="New task…" className="flex-1 px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs" />
        <label className="flex items-center gap-1 text-[10px] text-slate-500 shrink-0">
          <input type="checkbox" checked={draftRequiresAttachment} onChange={(e) => setDraftRequiresAttachment(e.target.checked)} className="accent-teal-600" />
          Attachment
        </label>
        <label className="flex items-center gap-1 text-[10px] text-slate-500 shrink-0">
          <input type="checkbox" checked={draftRequiresRemark} onChange={(e) => setDraftRequiresRemark(e.target.checked)} className="accent-teal-600" />
          Remark
        </label>
        <input type="number" value={draftWeight} onChange={(e) => setDraftWeight(Number(e.target.value))} className="w-16 px-2 py-1.5 rounded-lg border border-slate-200 text-xs text-center" />
        <button onClick={() => { if (draftText.trim()) { addTaskToGoal(goal.id, draftText.trim(), draftWeight, draftRequiresAttachment, draftRequiresRemark); setDraftText(""); setDraftRequiresAttachment(false); setDraftRequiresRemark(false); } }} className="px-2.5 py-1.5 rounded-lg bg-slate-900 text-white text-xs font-medium">Add</button>
      </div>

      <button onClick={() => setShowAssign((s) => !s)} className="text-xs font-medium text-teal-700 hover:underline mb-2">
        {goal.assignedEmployeeIds.length} assigned {goal.isTeamGoal ? "(whole department)" : "— manage assignment"}
      </button>
      {showAssign && !goal.isTeamGoal && (
        <div className="border border-slate-200 rounded-lg p-3">
          <div className="flex items-center gap-2 mb-2 bg-slate-50 rounded-md px-2 py-1.5">
            <Search size={13} className="text-slate-400" />
            <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search by name…" className="bg-transparent text-xs flex-1 focus:outline-none" />
          </div>
          <div className="grid grid-cols-2 gap-1.5 max-h-48 overflow-y-auto">
            {filtered.map((e) => {
              const checked = goal.assignedEmployeeIds.includes(e.id);
              return (
                <label key={e.id} className={`flex items-center gap-1.5 text-xs px-2 py-1.5 rounded-md cursor-pointer ${checked ? "bg-teal-50 text-teal-700" : "text-slate-600 hover:bg-slate-50"}`}>
                  <input type="checkbox" checked={checked} onChange={() => handleToggleAssignment(e)} className="accent-teal-600" />
                  {e.name}
                </label>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function NewGoalForm({ deptId, deptEmployees, addGoal, onDone, notify }) {
  const [goalType, setGoalType] = useState("project"); // "project" | "annual"
  const [isCore, setIsCore] = useState(false);
  const [name, setName] = useState("");
  const [description, setDescription] = useState("");
  const todayIso = isoDate(new Date());
  const [startDate, setStartDate] = useState(todayIso);
  const [endDate, setEndDate] = useState(isoDate(new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0)));
  const [reviewCutoffDate, setReviewCutoffDate] = useState(addDays(isoDate(new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0)), 5));
  const [reviewCutoffOffsetDays, setReviewCutoffOffsetDays] = useState(5);
  const [tasks, setTasks] = useState([{ text: "", weight: 100, requiresAttachment: false, requiresRemark: false }]);
  const [assigned, setAssigned] = useState([]);

  const updateTask = (idx, patch) => setTasks((prev) => prev.map((t, i) => i === idx ? { ...t, ...patch } : t));

  const applyPreset = (preset) => {
    const now = new Date();
    if (preset === "calendar") {
      setStartDate(isoDate(new Date(now.getFullYear(), 0, 1)));
      setEndDate(isoDate(new Date(now.getFullYear(), 11, 31)));
    } else if (typeof preset === "number") {
      // fiscal year starting at month index `preset` (0=Jan..11=Dec), running 12 months from the most recent occurrence
      let startYear = now.getFullYear();
      if (now.getMonth() < preset) startYear -= 1;
      const start = new Date(startYear, preset, 1);
      const end = new Date(startYear + 1, preset, 0);
      setStartDate(isoDate(start));
      setEndDate(isoDate(end));
    }
  };

  const submit = () => {
    if (!name.trim() || tasks.some((t) => !t.text.trim())) return;
    if (isCore && goalType !== "annual") return; // core only makes sense for annual/whole-dept goals
    addGoal(
      deptId, name.trim(), description.trim(), startDate, endDate, reviewCutoffDate, tasks,
      assigned,
      { isAnnual: goalType === "annual", isCore, reviewCutoffOffsetDays }
    );
    notify(isCore ? `Created core goal "${name.trim()}" for the whole department` : `Created "${name.trim()}" with ${assigned.length} staff assigned`);
    onDone();
  };

  return (
    <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-5 mt-4">
      <p className="text-sm font-semibold mb-3">New goal</p>

      <div className="flex bg-slate-100 rounded-lg p-1 mb-3 max-w-xs">
        <button onClick={() => setGoalType("project")} className={`flex-1 py-1.5 rounded-md text-xs font-medium ${goalType === "project" ? "bg-white shadow-sm text-slate-900" : "text-slate-500"}`}>Project (fixed dates)</button>
        <button onClick={() => setGoalType("annual")} className={`flex-1 py-1.5 rounded-md text-xs font-medium ${goalType === "annual" ? "bg-white shadow-sm text-slate-900" : "text-slate-500"}`}>Annual (repeats monthly)</button>
      </div>

      <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Goal name" className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm mb-2" />
      <input value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Description (optional)" className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm mb-2" />

      {goalType === "annual" && (
        <div className="mb-2">
          <p className="text-[11px] text-slate-400 mb-1">Quick-fill a range (you can still adjust the dates below)</p>
          <div className="flex flex-wrap gap-1.5">
            <button onClick={() => applyPreset("calendar")} className="px-2.5 py-1 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">This calendar year</button>
            {["Jan", "Apr", "Jul", "Oct"].map((label, idx) => (
              <button key={label} onClick={() => applyPreset([0, 3, 6, 9][idx])} className="px-2.5 py-1 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">Fiscal year from {label}</button>
            ))}
          </div>
        </div>
      )}

      <div className="grid grid-cols-3 gap-2 mb-3">
        <div>
          <label className="text-[11px] text-slate-400">{goalType === "annual" ? "Range start" : "Staff start date"}</label>
          <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm" />
          <p className="text-[10px] text-slate-400 mt-0.5">{fmtDMY(startDate)}</p>
        </div>
        <div>
          <label className="text-[11px] text-slate-400">{goalType === "annual" ? "Range end" : "Staff cut-off (due)"}</label>
          <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm" />
          <p className="text-[10px] text-slate-400 mt-0.5">{fmtDMY(endDate)}</p>
        </div>
        <div>
          <label className="text-[11px] text-slate-400">{goalType === "annual" ? "Review cut-off (days after month end)" : "Management review cut-off"}</label>
          {goalType === "annual" ? (
            <input type="number" min={0} value={reviewCutoffOffsetDays} onChange={(e) => setReviewCutoffOffsetDays(Number(e.target.value))} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm" />
          ) : (
            <>
              <input type="date" value={reviewCutoffDate} onChange={(e) => setReviewCutoffDate(e.target.value)} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm" />
              <p className="text-[10px] text-slate-400 mt-0.5">{fmtDMY(reviewCutoffDate)}</p>
            </>
          )}
        </div>
      </div>

      {goalType === "annual" && (
        <label className="flex items-center gap-2 text-xs text-slate-600 mb-3 bg-rose-50 px-3 py-2 rounded-lg">
          <input type="checkbox" checked={isCore} onChange={(e) => setIsCore(e.target.checked)} className="accent-rose-500" />
          <Star size={13} className="text-rose-500 fill-rose-500" />
          Mark as core goal — flagged as important, and can't be deleted later. Pick who it applies to below, same as any other goal.
        </label>
      )}

      <p className="text-xs text-slate-400 mb-1.5">Tasks — each carries its own point value; the total becomes the 100% baseline for this goal</p>
      {tasks.map((t, idx) => (
        <div key={idx} className="flex gap-2 mb-1.5 items-center">
          <input value={t.text} onChange={(e) => updateTask(idx, { text: e.target.value })} placeholder="Task description" className="flex-1 px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs" />
          <label className="flex items-center gap-1 text-[10px] text-slate-500 shrink-0">
            <input type="checkbox" checked={!!t.requiresAttachment} onChange={(e) => updateTask(idx, { requiresAttachment: e.target.checked })} className="accent-teal-600" />
            Attachment
          </label>
          <label className="flex items-center gap-1 text-[10px] text-slate-500 shrink-0">
            <input type="checkbox" checked={!!t.requiresRemark} onChange={(e) => updateTask(idx, { requiresRemark: e.target.checked })} className="accent-teal-600" />
            Remark
          </label>
          <input type="number" value={t.weight} onChange={(e) => updateTask(idx, { weight: Number(e.target.value) })} className="w-16 px-2 py-1.5 rounded-lg border border-slate-200 text-xs text-center" />
        </div>
      ))}
      <button onClick={() => setTasks((p) => [...p, { text: "", weight: 0, requiresAttachment: false, requiresRemark: false }])} className="text-xs text-teal-700 font-medium mb-3">+ add task</button>

      <p className="text-xs text-slate-400 mb-1.5">Assign employees</p>
      <div className="grid grid-cols-2 gap-1.5 max-h-40 overflow-y-auto mb-4 border border-slate-100 rounded-lg p-2">
        {deptEmployees.map((e) => {
          const checked = assigned.includes(e.id);
          return (
            <label key={e.id} className={`flex items-center gap-1.5 text-xs px-2 py-1 rounded-md cursor-pointer ${checked ? "bg-teal-50 text-teal-700" : "text-slate-600"}`}>
              <input type="checkbox" checked={checked} onChange={() => setAssigned((prev) => checked ? prev.filter((id) => id !== e.id) : [...prev, e.id])} className="accent-teal-600" />
              {e.name}
            </label>
          );
        })}
      </div>

      <div className="flex gap-2">
        <button onClick={submit} className="px-4 py-2 rounded-lg bg-slate-900 text-white text-sm font-medium">Create goal</button>
        <button onClick={onDone} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium">Cancel</button>
      </div>
    </div>
  );
}

function AdminApprovals({ departments, goals, activeCompanyId, switchCompany, companies, activeDeptId, setActiveDeptId, employees, getRecord, setApproval, setAdminRemark, adminUntick, isReviewLocked, getMonthView, notify }) {
  const deptsInCompany = departments.filter((d) => d.companyId === activeCompanyId && d.active !== false);
  const deptGoals = goals.filter((g) => g.deptId === activeDeptId && g.active !== false);
  const empById = {};
  employees.forEach((e) => (empById[e.id] = e));
  const [pointsDraft, setPointsDraft] = useState({}); // rowKey -> draft awarded points before clicking Approve
  const [isoMonth, setIsoMonth] = useState(currentIsoMonth());
  const [lightbox, setLightbox] = useState(null);

  // Attachments live in a private bucket, so there's no permanent public URL to just point <img> at —
  // fetch a short-lived signed URL right when admin asks to view one.
  const openAttachment = async (path) => {
    const { data, error } = await supabaseClient.storage.from("task-attachments").createSignedUrl(path, 300);
    if (error || !data?.signedUrl) {
      console.error("Failed to open attachment:", error);
      notify("Couldn't open that attachment — it may have been removed.");
      return;
    }
    const title = attachmentFileName(path);
    if (attachmentIsImage(path)) setLightbox({ type: "image", title, src: data.signedUrl });
    else setLightbox({ type: "file", title, src: data.signedUrl });
  };

  return (
    <div>
      <SectionTitle sub="Review ticked tasks for the selected month. Approve with full or partial points and check what staff submitted — or un-tick if it isn't actually complete.">Approvals</SectionTitle>
      <CompanyTabs companies={companies} activeCompanyId={activeCompanyId} switchCompany={switchCompany} />
      <div className="flex items-center gap-3 mb-3">
        <DeptTabs departments={deptsInCompany} activeDeptId={activeDeptId} setActiveDeptId={setActiveDeptId} />
        <input type="month" value={isoMonth} onChange={(e) => setIsoMonth(e.target.value)} className="px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs shrink-0" />
      </div>

      {deptGoals.map((goal) => {
        let tasksForMonth, assignedForMonth, isActionable, recordsForMonth;
        if (goal.isAnnual) {
          const view = getMonthView(goal, isoMonth);
          if (view.status === "scheduled" || view.status === "inherited") return null; // nothing to review before it happens
          tasksForMonth = view.tasks; assignedForMonth = view.assignedEmployeeIds;
          isActionable = view.status === "live";
          recordsForMonth = view.records || null;
        } else {
          if (goal.startDate.slice(0, 7) !== isoMonth) return null;
          tasksForMonth = goal.tasks; assignedForMonth = goal.assignedEmployeeIds;
          isActionable = true;
        }

        const rows = [];
        assignedForMonth.forEach((empId) => {
          tasksForMonth.forEach((task) => {
            if (isActionable) {
              const rec = getRecord(empId, goal.id, task.id);
              if (rec.done || rec.approval !== "none") rows.push({ empId, task, rec });
            } else if (recordsForMonth) {
              const r = recordsForMonth[empId]?.[task.id];
              if (r && r.done) rows.push({ empId, task, rec: r, readOnly: true });
            }
          });
        });
        const reviewLocked = isReviewLocked(goal);

        return (
          <div key={goal.id} className="bg-white rounded-xl border border-slate-200 mt-4 overflow-hidden">
            <div className="px-4 py-2.5 bg-slate-50/60 border-b border-slate-100 flex items-center justify-between">
              <span className="text-sm font-medium flex items-center gap-1.5">{goal.isTeamGoal && <Star size={12} className="text-amber-500 fill-amber-500" />}{goal.name}</span>
              <span className={`text-xs ${isActionable && reviewLocked ? "text-rose-500 font-medium" : "text-slate-400"}`}>
                {!isActionable ? monthLabel(isoMonth) + " (closed)" : reviewLocked ? `Review window closed (was open until ${fmtDate(goal.reviewCutoffDate || goal.endDate)})` : `Review by ${fmtDate(goal.reviewCutoffDate || goal.endDate)}`}
              </span>
            </div>
            {rows.length === 0 ? (
              <p className="text-xs text-slate-400 p-4">No one ticked a task on this goal in {monthLabel(isoMonth)}.</p>
            ) : (
              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b border-slate-100 bg-slate-50/60 text-left text-slate-500">
                    <th className="px-3 py-2 font-medium">Employee</th>
                    <th className="px-3 py-2 font-medium">Task</th>
                    <th className="px-3 py-2 font-medium text-center">Points</th>
                    <th className="px-3 py-2 font-medium">Staff's remark</th>
                    <th className="px-3 py-2 font-medium">Attachment</th>
                    <th className="px-3 py-2 font-medium">Admin remark</th>
                    <th className="px-3 py-2 font-medium text-center">Status</th>
                    {isActionable && <th className="px-3 py-2 font-medium text-right">Action</th>}
                  </tr>
                </thead>
                <tbody>
                  {rows.map(({ empId, task, rec, readOnly }) => {
                    const rowKey = `${empId}::${task.id}`;
                    const effectiveWeight = rec.approval === "approved" ? (rec.awardedWeight ?? task.weight) : task.weight;
                    const draft = pointsDraft[rowKey] ?? (rec.awardedPoints ?? effectiveWeight);
                    return (
                      <tr key={rowKey} className="border-b border-slate-50 last:border-0 align-top">
                        <td className="px-3 py-2.5 font-medium text-slate-700 whitespace-nowrap">{empById[empId]?.name}</td>
                        <td className="px-3 py-2.5 text-slate-600">
                          {task.text}
                          {rec.approval === "approved" && rec.awardedWeight != null && rec.awardedWeight !== task.weight && (
                            <span className="block text-[10px] text-amber-600 mt-0.5">Approved under old {rec.awardedWeight}-pt criteria (now {task.weight} pts)</span>
                          )}
                        </td>
                        <td className="px-3 py-2.5 text-center whitespace-nowrap">
                          {readOnly ? (
                            <span className="font-mono text-xs">{rec.awardedPoints ?? 0}/{effectiveWeight}</span>
                          ) : (
                            <div className="flex items-center justify-center gap-1">
                              <input type="number" min={0} max={effectiveWeight} value={draft} onChange={(e) => setPointsDraft((p) => ({ ...p, [rowKey]: Math.max(0, Math.min(effectiveWeight, Number(e.target.value))) }))} className="w-14 text-center font-mono text-xs px-1.5 py-1 rounded-md border border-slate-200" />
                              <span className="text-xs text-slate-400">/{effectiveWeight}</span>
                            </div>
                          )}
                        </td>
                        <td className="px-3 py-2.5">
                          {rec.remark ? (
                            <button onClick={() => setLightbox({ type: "text", title: "Staff's remark", text: rec.remark })} title="View staff's remark" className="p-1.5 rounded-md bg-slate-50 text-slate-500 hover:bg-teal-50 hover:text-teal-700 transition-colors"><MessageCircle size={14} /></button>
                          ) : <span className="text-xs text-slate-300">—</span>}
                        </td>
                        <td className="px-3 py-2.5">
                          {rec.attachment ? (
                            <button onClick={() => openAttachment(rec.attachment)} title={attachmentFileName(rec.attachment)} className="p-1.5 rounded-md bg-slate-50 text-slate-500 hover:bg-teal-50 hover:text-teal-700 transition-colors">
                              <Upload size={14} />
                            </button>
                          ) : rec.noAttachmentReason ? (
                            <span className="text-[11px] text-amber-600">No attachment (staff marked N/A)</span>
                          ) : (
                            <span className="text-[11px] text-slate-300">None</span>
                          )}
                        </td>
                        <td className="px-3 py-2.5 min-w-[140px]">
                          {readOnly ? (
                            <span className="text-xs text-slate-500">{rec.adminRemark || "—"}</span>
                          ) : (
                            <input value={rec.adminRemark || ""} onChange={(e) => setAdminRemark(empId, goal.id, task.id, e.target.value)} placeholder="Note to staff…" className="w-full text-xs px-2 py-1 rounded-md border border-slate-200 focus:outline-none focus:ring-1 focus:ring-teal-600" />
                          )}
                        </td>
                        <td className="px-3 py-2.5 text-center whitespace-nowrap">
                          {rec.approval === "approved" && <span className="text-[11px] font-semibold text-emerald-600">Approved</span>}
                          {rec.approval === "pending" && <span className="text-[11px] font-semibold text-amber-600">Pending</span>}
                        </td>
                        {isActionable && (

                          </td>
                        )}
                      </tr>
                    );
                  })}

            )}

        );

}

function NewRewardSchemeForm({ deptId, companyId, goals, addRewardScheme, notify, onDone }) {
  const [goalId, setGoalId] = useState(goals[0]?.id || "");
  const now = new Date();
  const [startDate, setStartDate] = useState(isoDate(new Date(now.getFullYear(), 0, 1)));
  const [endDate, setEndDate] = useState(isoDate(new Date(now.getFullYear(), 11, 31)));
  const [baseAmount, setBaseAmount] = useState(500);

  const applyPreset = (preset) => {
    if (preset === "calendar") {
      setStartDate(isoDate(new Date(now.getFullYear(), 0, 1)));
      setEndDate(isoDate(new Date(now.getFullYear(), 11, 31)));
    } else if (typeof preset === "number") {
      let startYear = now.getFullYear();
      if (now.getMonth() < preset) startYear -= 1;
      setStartDate(isoDate(new Date(startYear, preset, 1)));
      setEndDate(isoDate(new Date(startYear + 1, preset, 0)));
    }
  };

  const submit = () => {
    if (!goalId) return;
    addRewardScheme(deptId, companyId, goalId, startDate, endDate, baseAmount);
    notify("Reward scheme created");
    onDone();
  };

  return (
    <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-5 mb-4">
      <p className="text-sm font-semibold mb-3">New reward scheme</p>
      <label className="text-[11px] text-slate-400">Goal to reward</label>
      <select value={goalId} onChange={(e) => setGoalId(e.target.value)} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm mb-3">
        {goals.length === 0 && <option value="">No goals in this department yet</option>}
        {goals.map((g) => <option key={g.id} value={g.id}>{g.name}</option>)}
      </select>

      <p className="text-[11px] text-slate-400 mb-1">Quick-fill a period (you can still adjust the dates)</p>
      <div className="flex flex-wrap gap-1.5 mb-3">
        <button onClick={() => applyPreset("calendar")} className="px-2.5 py-1 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">This calendar year</button>
        {["Jan", "Apr", "Jul", "Oct"].map((label, idx) => (
          <button key={label} onClick={() => applyPreset([0, 3, 6, 9][idx])} className="px-2.5 py-1 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">Fiscal year from {label}</button>
        ))}
      </div>

      <div className="grid grid-cols-2 gap-2 mb-3">
        <div>
          <label className="text-[11px] text-slate-400">Start date</label>
          <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm" />
          <p className="text-[10px] text-slate-400 mt-0.5">{fmtDMY(startDate)}</p>
        </div>
        <div>
          <label className="text-[11px] text-slate-400">End date</label>
          <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm" />
          <p className="text-[10px] text-slate-400 mt-0.5">{fmtDMY(endDate)}</p>
        </div>
      </div>

      <div className="mb-4">
        <label className="text-[11px] text-slate-400">Base amount ($)</label>
        <div className="flex items-center gap-1 px-3 py-2 rounded-lg border border-slate-200 text-sm max-w-[200px]">
          <span className="text-slate-400">$</span>
          <input type="number" value={baseAmount} onChange={(e) => setBaseAmount(Number(e.target.value))} className="flex-1 outline-none" />
        </div>
        <p className="text-[11px] text-slate-400 mt-1.5">This is the starting amount for everyone you enroll — you can adjust it per employee afterward to any number.</p>
      </div>

      <div className="flex gap-2">
        <button onClick={submit} className="px-4 py-2 rounded-lg bg-slate-900 text-white text-sm font-medium">Create scheme</button>
        <button onClick={onDone} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium">Cancel</button>
      </div>
    </div>
  );
}

function RewardSchemeDetail({ scheme, dept, employees, goals, toggleRewardActive, toggleRewardEnrollment, updateRewardEmployeeOverride, commitRewardSchemeEdit, goalCompletionForEmployee, getMonthView, notify, initialMonth, onBack }) {
  const goal = goals.find((g) => g.id === scheme.goalId);
  const [editing, setEditing] = useState(false);
  const [draftAmount, setDraftAmount] = useState(scheme.baseAmount);
  const [showScopeModal, setShowScopeModal] = useState(false);

  const cur = currentIsoMonth();
  const schemeMonths = monthsInRange(scheme.startDate, scheme.endDate);
  const preferredStart = (initialMonth && schemeMonths.includes(initialMonth)) ? initialMonth : (schemeMonths.includes(cur) ? cur : (schemeMonths[schemeMonths.length - 1] || cur));
  const [selectedMonth, setSelectedMonth] = useState(preferredStart);
  const isPastMonth = selectedMonth < cur;
  const isFutureMonth = selectedMonth > cur;
  const deadline = endOfMonth(selectedMonth);

  // Completion% for a past month reads the goal's own frozen history (accurate). For the live month it
  // reads current progress. Shown for reference only — the reward amount itself is set freely per employee.
  const completionInSelectedMonth = (empId) => {
    if (!goal) return 0;
    if (!goal.isAnnual) return goalCompletionForEmployee(goal, empId);
    const view = getMonthView(goal, selectedMonth);
    if (view.status === "live") return goalCompletionForEmployee(goal, empId);
    if (view.status === "past" && view.records) {
      let awardedSum = 0, capacity = 0;
      view.tasks.forEach((t) => {
        const r = view.records[empId]?.[t.id];
        capacity += t.weight;
        if (r && r.approval === "approved") awardedSum += (r.awardedPoints ?? t.weight);
      });
      return capacity > 0 ? Math.round((awardedSum / capacity) * 1000) / 10 : 0;
    }
    return 0; // scheduled/future month — nothing to show yet
  };

  const saveEdit = () => setShowScopeModal(true);
  const confirmScope = (scope) => {
    commitRewardSchemeEdit(scheme.id, draftAmount, scope);
    setShowScopeModal(false);
    setEditing(false);
  };

  return (
    <div>
      <button onClick={onBack} className="flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-800 mb-4">
        <Undo2 size={14} />Back to reward schemes
      </button>

      <div className="bg-white rounded-xl border border-slate-200 p-5 mb-4">
        <div className="flex items-center justify-between mb-2">
          <div>
            <p className="font-display font-semibold text-sm">{dept?.name} — {goal?.name || "Reward scheme"}</p>
            <p className="text-xs text-slate-400">{fmtDMY(scheme.startDate)} – {fmtDMY(scheme.endDate)} · Deadline this period: {fmtDMY(deadline)}</p>
          </div>
          <button onClick={() => { toggleRewardActive(scheme.id); notify(scheme.active ? "Scheme turned off" : "Scheme turned on"); }} className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold ${scheme.active ? "bg-emerald-50 text-emerald-600" : "bg-slate-100 text-slate-400"}`}>
            <div className={`w-7 h-4 rounded-full relative transition-colors ${scheme.active ? "bg-emerald-500" : "bg-slate-300"}`}>
              <div className={`absolute top-0.5 w-3 h-3 rounded-full bg-white transition-all ${scheme.active ? "left-3.5" : "left-0.5"}`} />
            </div>
            {scheme.active ? "Active" : "Inactive"}
          </button>
        </div>

        {!editing ? (
          <button onClick={() => { setEditing(true); setDraftAmount(scheme.baseAmount); }} className="text-xs font-medium text-teal-700 hover:underline">Edit base amount</button>
        ) : (
          <div className="flex items-end gap-2 mt-2">
            <div>
              <label className="text-[11px] text-slate-400">Base amount</label>
              <input type="number" value={draftAmount} onChange={(e) => setDraftAmount(Number(e.target.value))} className="w-24 px-2 py-1.5 rounded-md border border-slate-200 text-sm" />
            </div>
            <button onClick={saveEdit} className="px-3 py-1.5 rounded-lg bg-slate-900 text-white text-xs font-medium">Save</button>
            <button onClick={() => setEditing(false)} className="px-3 py-1.5 rounded-lg border border-slate-200 text-slate-600 text-xs font-medium">Cancel</button>
          </div>
        )}
      </div>

      <div className="flex items-center gap-3 mb-3">
        <div>
          <label className="text-[11px] text-slate-400 block mb-0.5">Viewing period</label>
          <select value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} className="px-3 py-1.5 rounded-lg border border-slate-200 text-sm">
            {schemeMonths.map((m) => <option key={m} value={m}>{monthLabel(m)}{m === cur ? " (current)" : ""}</option>)}
          </select>
        </div>
        {isPastMonth && <span className="text-[11px] font-medium text-slate-500 bg-slate-100 px-2.5 py-1 rounded-full mt-4">Viewing a past period — read-only history</span>}
        {isFutureMonth && <span className="text-[11px] font-medium text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full mt-4">Upcoming period — nothing to show yet</span>}
      </div>

      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm" style={{ minWidth: 1100 }}>
          <thead>
            <tr className="border-b border-slate-100 bg-slate-50/60 text-left text-slate-500">
              <th className="px-3 py-2.5 font-medium"></th>
              <th className="px-3 py-2.5 font-medium">Update amount</th>
              <th className="px-3 py-2.5 font-medium">Employee</th>
              <th className="px-3 py-2.5 font-medium">Status</th>
              <th className="px-3 py-2.5 font-medium">Current mission</th>
              <th className="px-3 py-2.5 font-medium">Remark</th>
              <th className="px-3 py-2.5 font-medium">Period</th>
              <th className="px-3 py-2.5 font-medium">Deadline</th>
              <th className="px-3 py-2.5 font-medium text-center">History</th>
            </tr>
          </thead>
          <tbody>
            {employees.map((e) => {
              const enrolled = scheme.enrolledEmployeeIds.includes(e.id);
              const override = scheme.employeeOverrides[e.id] || { updateAmount: scheme.baseAmount, remark: "" };
              const completion = completionInSelectedMonth(e.id);
              return (
                <tr key={e.id} className="border-b border-slate-50 last:border-0">
                  <td className="px-3 py-2.5"><input type="checkbox" checked={enrolled} disabled={isPastMonth || isFutureMonth} onChange={() => toggleRewardEnrollment(scheme.id, e.id)} className="accent-teal-600 disabled:opacity-40" /></td>
                  <td className="px-3 py-2.5">
                    <div className="flex items-center gap-1">
                      <span className="text-slate-400">$</span>
                      <input type="number" value={override.updateAmount} disabled={isPastMonth || isFutureMonth} onChange={(ev) => updateRewardEmployeeOverride(scheme.id, e.id, { updateAmount: Number(ev.target.value) })} className="w-20 px-1.5 py-1 rounded-md border border-slate-200 text-xs disabled:opacity-40 disabled:bg-slate-50" />
                    </div>
                  </td>
                  <td className="px-3 py-2.5 font-medium text-slate-700 whitespace-nowrap">{e.name}</td>
                  <td className="px-3 py-2.5"><span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${enrolled ? "bg-emerald-50 text-emerald-600" : "bg-slate-100 text-slate-400"}`}>{enrolled ? "Eligible" : "Not enrolled"}</span></td>
                  <td className="px-3 py-2.5 text-slate-500 whitespace-nowrap">{goal?.name || "—"} <span className="text-slate-400">({completion}%)</span></td>
                  <td className="px-3 py-2.5"><input value={override.remark} disabled={isPastMonth || isFutureMonth} onChange={(ev) => updateRewardEmployeeOverride(scheme.id, e.id, { remark: ev.target.value })} placeholder="—" className="w-32 px-1.5 py-1 rounded-md border border-slate-200 text-xs disabled:opacity-40 disabled:bg-slate-50" /></td>
                  <td className="px-3 py-2.5 text-slate-500 text-xs whitespace-nowrap">Monthly</td>
                  <td className="px-3 py-2.5 text-slate-500 text-xs whitespace-nowrap">{fmtDMY(deadline)}</td>
                  <td className="px-3 py-2.5 text-center"><button title="History" className="text-slate-400 hover:text-slate-600"><CalendarClock size={14} /></button></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {showScopeModal && (
        <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-30 p-6" onClick={() => setShowScopeModal(false)}>
          <div className="bg-white rounded-xl max-w-md w-full p-6" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center gap-2 mb-2">
              <AlertTriangle size={18} className="text-amber-500" />
              <p className="font-display font-semibold">Update reward scheme</p>
            </div>
            <p className="text-sm text-slate-500 mb-4">Choose how far this change should apply.</p>
            <div className="space-y-2">
              <button onClick={() => confirmScope("current")} className="w-full text-left px-4 py-2.5 rounded-lg border border-slate-200 hover:border-teal-300 hover:bg-teal-50 transition-colors">
                <p className="text-sm font-medium">This month only</p>
                <p className="text-xs text-slate-400">Reverts back to the old setup automatically next month</p>
              </button>
              <button onClick={() => confirmScope("currentAndFuture")} className="w-full text-left px-4 py-2.5 rounded-lg border border-slate-200 hover:border-teal-300 hover:bg-teal-50 transition-colors">
                <p className="text-sm font-medium">This month & every future month</p>
                <p className="text-xs text-slate-400">Applies now and stays this way until changed again</p>
              </button>
              <button onClick={() => setShowScopeModal(false)} className="w-full text-center px-4 py-2 rounded-lg text-slate-500 text-sm">Cancel</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function AdminReports({ companies, activeCompanyId, switchCompany, departments, employees, employeePoints, employeeGoals, getRecord }) {
  const deptsInCompany = departments.filter((d) => d.active !== false && d.companyId === activeCompanyId);
  const companyEmployeeIds = new Set(deptsInCompany.map((d) => d.id));
  const [deptFilter, setDeptFilter] = useState("all");
  const [isoMonth, setIsoMonth] = useState(currentIsoMonth());
  const month = monthLabel(isoMonth);

  useEffect(() => { setDeptFilter("all"); }, [activeCompanyId]);

  const buildRows = () =>
    employees
      .filter((e) => companyEmployeeIds.has(e.deptId) && (deptFilter === "all" || e.deptId === deptFilter))
      .map((e) => {
        const dept = departments.find((d) => d.id === e.deptId);
        const pts = employeePoints(e.id);
        let approvedCount = 0, pendingCount = 0;
        const remarksThisMonth = [];
        employeeGoals(e.id).forEach((goal) => {
          goal.tasks.forEach((t) => {
            const r = getRecord(e.id, goal.id, t.id);
            if (r.approval === "approved") approvedCount++;
            else if (r.approval === "pending") pendingCount++;
            if (r.remark && r.remark.trim()) remarksThisMonth.push(r.remark.trim());
          });
        });
        return {
          Period: month,
          Department: dept.name,
          Employee: e.name,
          Score: `${pts.percentage}%`,
          Remarks: remarksThisMonth.length ? remarksThisMonth.join(" · ") : "—",
          "Goals Approved": approvedCount,
          "Goals Pending": pendingCount,
        };
      });

  const rows = buildRows();

  const downloadExcel = () => {
    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Goal Performance");
    XLSX.writeFile(wb, `vimiGoal-Performance-${month.replace(/\s+/g, "-")}.xlsx`);
  };

  return (
    <div>
      <SectionTitle sub="Preview the report, then download it as an Excel spreadsheet.">Reports</SectionTitle>
      <CompanyTabs companies={companies} activeCompanyId={activeCompanyId} switchCompany={switchCompany} />
      <div className="bg-white rounded-xl border border-slate-200 p-5 mb-4">
        <div className="grid grid-cols-2 gap-3 mb-4">
          <input type="month" value={isoMonth} onChange={(e) => setIsoMonth(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 text-sm" />
          <select value={deptFilter} onChange={(e) => setDeptFilter(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-200 text-sm">
            <option value="all">All departments</option>
            {deptsInCompany.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
          </select>
        </div>
        <button onClick={downloadExcel} className="flex items-center gap-2 px-4 py-2.5 rounded-lg bg-teal-600 text-white text-sm font-semibold"><FileSpreadsheet size={16} />Download as Excel</button>
      </div>

      <p className="text-xs uppercase tracking-wide text-slate-400 font-medium mb-2 px-1">Preview</p>
      <div className="bg-white rounded-xl border border-slate-200 overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="border-b border-slate-100 bg-slate-50/60 text-left text-slate-500">
              <th className="px-3 py-2 font-medium whitespace-nowrap">Period</th>
              <th className="px-3 py-2 font-medium whitespace-nowrap">Department</th>
              <th className="px-3 py-2 font-medium whitespace-nowrap">Employee</th>
              <th className="px-3 py-2 font-medium whitespace-nowrap">Score</th>
              <th className="px-3 py-2 font-medium">Remarks</th>
              <th className="px-3 py-2 font-medium text-center whitespace-nowrap">Approved</th>
              <th className="px-3 py-2 font-medium text-center whitespace-nowrap">Pending</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r, idx) => (
              <tr key={idx} className="border-b border-slate-50 last:border-0">
                <td className="px-3 py-2 text-slate-500 whitespace-nowrap">{r.Period}</td>
                <td className="px-3 py-2 text-slate-600 whitespace-nowrap">{r.Department}</td>
                <td className="px-3 py-2 font-medium text-slate-700 whitespace-nowrap">{r.Employee}</td>
                <td className="px-3 py-2 font-mono text-xs whitespace-nowrap">{r.Score}</td>
                <td className="px-3 py-2 text-slate-500 max-w-xs truncate">{r.Remarks}</td>
                <td className="px-3 py-2 text-center font-mono text-xs text-emerald-600">{r["Goals Approved"]}</td>
                <td className="px-3 py-2 text-center font-mono text-xs text-amber-600">{r["Goals Pending"]}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function AdminLeaderboard({ companies, activeCompanyId, switchCompany, employees, departments, deptById, employeePoints }) {
  const [view, setView] = useState("overall");
  const deptsInCompany = departments.filter((d) => d.active !== false && d.companyId === activeCompanyId);
  const companyDeptIds = new Set(deptsInCompany.map((d) => d.id));
  const companyEmployees = employees.filter((e) => companyDeptIds.has(e.deptId));
  const ranked = [...companyEmployees].map((e) => ({ ...e, pts: employeePoints(e.id).percentage })).sort((a, b) => b.pts - a.pts);
  const deptAvg = (deptId) => {
    const emps = employees.filter((e) => e.deptId === deptId);
    if (emps.length === 0) return 0;
    return Math.round(emps.reduce((a, e) => a + employeePoints(e.id).percentage, 0) / emps.length);
  };
  const deptRanked = [...deptsInCompany].map((d) => ({ ...d, avg: deptAvg(d.id) })).sort((a, b) => b.avg - a.avg);

  return (
    <div>
      <SectionTitle sub="Overall company ranking, plus department averages so you can spot the strongest team at a glance.">Leaderboard</SectionTitle>
      <CompanyTabs companies={companies} activeCompanyId={activeCompanyId} switchCompany={switchCompany} />
      <div className="flex bg-slate-100 rounded-lg p-1 mb-4 max-w-xs">
        <button onClick={() => setView("overall")} className={`flex-1 py-1.5 rounded-md text-xs font-medium ${view === "overall" ? "bg-white shadow-sm text-slate-900" : "text-slate-500"}`}>Company-wide</button>
        <button onClick={() => setView("dept")} className={`flex-1 py-1.5 rounded-md text-xs font-medium ${view === "dept" ? "bg-white shadow-sm text-slate-900" : "text-slate-500"}`}>By department</button>
      </div>

      {view === "overall" ? (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-slate-100 bg-slate-50/60 text-left text-slate-500">
                <th className="px-4 py-2.5 font-medium w-12">#</th>
                <th className="px-4 py-2.5 font-medium">Employee</th>
                <th className="px-4 py-2.5 font-medium">Department</th>
                <th className="px-4 py-2.5 font-medium text-right">Points</th>
              </tr>
            </thead>
            <tbody>
              {ranked.map((e, idx) => {
                const c = deptTheme(deptById[e.deptId]);
                return (
                  <tr key={e.id} className="border-b border-slate-50 last:border-0">
                    <td className="px-4 py-2 font-mono text-xs text-slate-400">{idx + 1}</td>
                    <td className="px-4 py-2 font-medium text-slate-700 flex items-center gap-1.5">{idx === 0 && <Award size={13} className="text-amber-500" />}{e.name}</td>
                    <td className="px-4 py-2"><span className={`text-xs px-2 py-0.5 rounded-full ${c.light} ${c.text}`}>{deptById[e.deptId].name}</span></td>
                    <td className="px-4 py-2 text-right"><PercentBar value={e.pts} width={90} colorClass={idx === 0 ? "bg-amber-500" : "bg-teal-600"} /></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      ) : (
        <div className="space-y-5">
          <div className="bg-white rounded-xl border border-slate-200 p-4">
            <p className="text-xs uppercase tracking-wide text-slate-400 font-medium mb-2">Department ranking</p>
            <div className="space-y-2">
              {deptRanked.map((d, idx) => {
                const c = deptTheme(d);
                return (
                  <div key={d.id} className="flex items-center gap-3">
                    <span className={`font-mono text-xs w-5 text-center font-semibold ${idx === 0 ? "text-amber-500" : "text-slate-400"}`}>{idx + 1}</span>
                    <span className="flex items-center gap-1.5 text-sm font-medium w-32"><span className={`w-2 h-2 rounded-full ${c.bg}`} />{d.name}</span>
                    <PercentBar value={d.avg} width={140} colorClass={c.bg} />
                  </div>
                );
              })}
            </div>
          </div>
          {deptsInCompany.map((d) => {
            const c = deptTheme(d);
            const deptStaff = ranked.filter((e) => e.deptId === d.id);
            return (
              <div key={d.id}>
                <p className={`text-sm font-medium mb-2 flex items-center gap-1.5`}><span className={`w-2 h-2 rounded-full ${c.bg}`} />{d.name}</p>
                <div className="bg-white rounded-xl border border-slate-200 divide-y divide-slate-50">
                  {deptStaff.map((e, idx) => (
                    <div key={e.id} className="px-4 py-2 flex items-center gap-3 text-sm">
                      <span className="font-mono text-xs text-slate-400 w-4">{idx + 1}</span>
                      <span className="flex-1">{e.name}</span>
                      <PercentBar value={e.pts} width={70} />
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

<script>
  // Registers the service worker so browsers will offer "Add to Home Screen."
  // Wrapped in a feature check + try/catch so it never breaks the app if unsupported.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch((err) => {
        console.warn("Service worker registration failed (app still works normally):", err);
      });
    });
  }
</script>
