            const approved = r?.approval === "approved";
            return (
              <div key={task.id} className="bg-white border border-slate-200 rounded-lg px-3.5 py-2.5">
                <div className="flex items-center justify-between">
                  <span className="text-sm text-slate-600">{task.text}</span>
                  <span className="font-mono text-xs font-semibold text-slate-400">{approved ? `${r.awardedPoints ?? task.weight}/${task.weight}` : `—/${task.weight}`} pts</span>
                </div>
                <span className={`inline-block mt-1 text-[11px] font-medium ${approved ? "text-emerald-600" : "text-slate-300"}`}>{approved ? "Approved" : "Not completed"}</span>
              </div>
            );
          })}
          {view.status !== "past" && view.tasks.map((task) => (
            <div key={task.id} className="flex items-center justify-between bg-slate-50 border border-slate-100 rounded-lg px-3.5 py-2.5 text-sm">
              <span className="text-slate-500">{task.text}</span>
              <span className="font-mono text-xs text-slate-400">{task.weight} pts · upcoming</span>
            </div>
          ))}
          {view.tasks.length === 0 && <p className="text-xs text-slate-400 px-1">No record for this month.</p>}
        </div>
      )}
    </div>
  );
}

function TaskRow({ task, goal, employee, colors, locked, rec, toggleTask, submitTaskWithDetails }) {
  const [expanded, setExpanded] = useState(false);
  const [remarkDraft, setRemarkDraft] = useState(rec.remark || "");
  const [attachmentDraft, setAttachmentDraft] = useState(rec.attachment || null);
  const [noAttachmentDraft, setNoAttachmentDraft] = useState(rec.noAttachmentReason || false);
  const [wobble, setWobble] = useState(false);
  const [warning, setWarning] = useState("");

  // Keep the raw File on the draft (for the actual upload on submit) alongside a local data-URL just
  // for the instant thumbnail preview here — the data URL itself is never sent to Supabase.
  const handleFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { setAttachmentDraft({ name: file.name, dataUrl: reader.result, isImage: file.type.startsWith("image/"), file }); setNoAttachmentDraft(false); };
    reader.readAsDataURL(file);
  };

  // attachmentDraft is either a fresh pick ({name, dataUrl, isImage, file}, not yet uploaded) or,
  // if this task already has a saved attachment (e.g. after an admin un-tick), the stored storage
  // path (a plain string) — normalize both into one shape for display.
  const draftName = attachmentDraft ? (attachmentDraft.name ?? attachmentFileName(attachmentDraft)) : "";
  const draftIsImage = attachmentDraft ? (attachmentDraft.isImage ?? attachmentIsImage(attachmentDraft)) : false;
  const draftPreviewSrc = attachmentDraft && attachmentDraft.dataUrl ? attachmentDraft.dataUrl : null;

  const commit = () => {
    const attachmentOk = !task.requiresAttachment || attachmentDraft || (noAttachmentDraft && remarkDraft.trim());
    const remarkOk = !task.requiresRemark || remarkDraft.trim();
    if (task.requiresAttachment && !attachmentDraft && !noAttachmentDraft) {
      setWarning("This task needs an attachment — or mark \"no attachment available\" and explain why.");
      setWobble(true); setTimeout(() => setWobble(false), 400); setExpanded(true);
      return;
    }
    if (task.requiresAttachment && noAttachmentDraft && !remarkDraft.trim()) {
      setWarning("Please add a remark explaining why there's no attachment.");
      setWobble(true); setTimeout(() => setWobble(false), 400); setExpanded(true);
      return;
    }
    if (task.requiresRemark && !remarkDraft.trim()) {
      setWarning("This task needs a remark before it can be marked complete.");
      setWobble(true); setTimeout(() => setWobble(false), 400); setExpanded(true);
      return;
    }
    submitTaskWithDetails(employee.id, goal, task.id, { remark: remarkDraft, attachment: attachmentDraft, noAttachmentReason: noAttachmentDraft });
    setWarning("");
    setExpanded(false);
  };

  const handleCheckboxClick = () => {
    if (locked) return;
    if (rec.done) {
      toggleTask(employee.id, goal, task.id);
      return;
    }
    if (task.requiresAttachment || task.requiresRemark) {
      commit();
    } else if (remarkDraft.trim() || attachmentDraft) {
      submitTaskWithDetails(employee.id, goal, task.id, { remark: remarkDraft, attachment: attachmentDraft, noAttachmentReason: noAttachmentDraft });
    } else {
      toggleTask(employee.id, goal, task.id);
    }
  };

  const displayWeight = rec.approval === "approved" ? (rec.awardedWeight ?? task.weight) : task.weight;

  return (
    <div className={`bg-white rounded-lg border p-3.5 ${wobble ? "wobble border-rose-300" : "border-slate-200"}`}>
      <div className="flex items-center justify-between gap-3">
        <button disabled={locked} onClick={handleCheckboxClick} className="flex items-center gap-3 flex-1 text-left disabled:cursor-not-allowed">
          {rec.done ? <CheckCircle2 className={colors.text} size={20} /> : <Circle className="text-slate-300" size={20} />}
          <span className={`text-sm ${rec.done ? "text-slate-500" : "text-slate-700"}`}>{task.text}</span>
        </button>
        <span className="font-mono text-xs font-semibold text-slate-400 shrink-0">
          {rec.approval === "approved" && rec.awardedPoints != null && rec.awardedPoints < displayWeight ? `${rec.awardedPoints}/${displayWeight}` : displayWeight} pts
        </span>
      </div>

      {rec.done ? (
        <div className="mt-2 ml-8 space-y-1">
          {rec.approval === "approved" && (
            <span className="inline-flex items-center gap-1 text-xs font-medium text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">
              <ShieldCheck size={12} />
              Approved{rec.awardedPoints != null && rec.awardedPoints < displayWeight ? " (partial)" : ""}
            </span>
          )}
          {rec.approval === "pending" && <span className="inline-flex items-center gap-1 text-xs font-medium text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full"><CalendarClock size={12} />Awaiting approval</span>}
          {rec.adminRemark && <p className="text-[11px] text-slate-500">Note from admin: {rec.adminRemark}</p>}
          {rec.attachment && <p className="text-[11px] text-slate-400">📎 {attachmentFileName(rec.attachment)}</p>}
        </div>
      ) : (
        !locked && (
          <div className="mt-2 ml-8">
            <button onClick={() => setExpanded((s) => !s)} className="text-[11px] text-teal-700 hover:underline">
              {expanded ? "Hide remark & attachment" : "Add remark or attachment"}
            </button>
            {expanded && (
              <div className="mt-2 space-y-2">
                {warning && <p className="text-[11px] text-rose-500">{warning}</p>}
                <textarea value={remarkDraft} onChange={(e) => setRemarkDraft(e.target.value)} placeholder="Add a remark…" rows={2} className="w-full text-xs border border-slate-200 rounded-lg p-2 focus:outline-none focus:ring-1 focus:ring-teal-600" />
                <div className="flex items-center gap-2 flex-wrap">
                  {attachmentDraft ? (
                    <div className="flex items-center gap-1.5 bg-slate-50 rounded-md px-2 py-1 text-[11px]">
                      {draftIsImage && draftPreviewSrc && <img src={draftPreviewSrc} className="w-6 h-6 rounded object-cover" />}
                      <span className="max-w-[120px] truncate">{draftName}</span>
                      <button onClick={() => setAttachmentDraft(null)} className="text-slate-300 hover:text-rose-500"><XCircle size={12} /></button>
                    </div>
                  ) : (
                    <label className="text-[11px] text-teal-700 hover:underline cursor-pointer">
                      Attach file
                      <input type="file" className="hidden" onChange={(e) => handleFile(e.target.files?.[0])} />
                    </label>
                  )}
                  {task.requiresAttachment && (
                    <label className="flex items-center gap-1 text-[11px] text-slate-500">
                      <input type="checkbox" checked={noAttachmentDraft} onChange={(e) => { setNoAttachmentDraft(e.target.checked); if (e.target.checked) setAttachmentDraft(null); }} className="accent-teal-600" />
                      No attachment available
                    </label>
                  )}
                </div>
                <button onClick={commit} className={`text-xs font-semibold ${colors.text}`}>Mark complete</button>
              </div>
            )}
          </div>
        )
      )}
    </div>
  );
}

function StaffCheckin({ employee, dept, colors, checkins, addCheckin }) {
  const [stage, setStage] = useState("idle"); // idle | locating | manualLoc | camera | done
  const [startedAt, setStartedAt] = useState(null);
  const [now, setNow] = useState(Date.now());
  const [location, setLocation] = useState(null);
  const [locError, setLocError] = useState("");
  const [manualLat, setManualLat] = useState("");
  const [manualLng, setManualLng] = useState("");
  const [photo, setPhoto] = useState(null);
  const [camError, setCamError] = useState("");
  const videoRef = useRef(null);
  const streamRef = useRef(null);

  const myCheckins = checkins.filter((c) => c.empId === employee.id).slice(0, 8);

  // live countdown while a check-in is in progress
  useEffect(() => {
    if (stage === "idle" || stage === "done") return;
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, [stage]);

  const secondsLeft = startedAt ? Math.max(0, 300 - Math.floor((now - startedAt) / 1000)) : 300;
  const overWindow = startedAt ? now - startedAt > 300000 : false;

  const stopCamera = () => { streamRef.current?.getTracks().forEach((t) => t.stop()); streamRef.current = null; };

  const startCheckin = () => {
    setStage("locating");
    setStartedAt(Date.now());
    setNow(Date.now());
    setLocError("");
    if (!navigator.geolocation) {
      setLocError("Geolocation isn't available in this browser/context.");
      setStage("manualLoc");
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => { setLocation({ lat: pos.coords.latitude, lng: pos.coords.longitude }); setStage("camera"); },
      (err) => { setLocError(err.message || "Location permission denied or blocked."); setStage("manualLoc"); },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  };

  const checkOut = () => {
    const finish = (loc) => addCheckin({ id: `ci-${Date.now()}`, empId: employee.id, deptId: dept.id, type: "out", timestamp: new Date().toISOString(), lat: loc?.lat ?? null, lng: loc?.lng ?? null, photo: null, elapsedSec: 0, withinWindow: true });
    if (!navigator.geolocation) { finish(null); return; }
    navigator.geolocation.getCurrentPosition((pos) => finish({ lat: pos.coords.latitude, lng: pos.coords.longitude }), () => finish(null));
  };

  useEffect(() => {
    if (stage !== "camera") return;
    setCamError("");
    navigator.mediaDevices?.getUserMedia({ video: { facingMode: "environment" } })
      .then((stream) => { streamRef.current = stream; if (videoRef.current) videoRef.current.srcObject = stream; })
      .catch((err) => setCamError(err.message || "Camera permission denied or blocked."));
    return stopCamera;
  }, [stage]);

  const capturePhoto = () => {
    const video = videoRef.current;
    if (!video || !video.videoWidth) return;
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    setPhoto(canvas.toDataURL("image/jpeg", 0.85));
    stopCamera();
    setStage("done");
  };

  const confirmCheckin = () => {
    const elapsedSec = Math.round((Date.now() - startedAt) / 1000);
    addCheckin({ id: `ci-${Date.now()}`, empId: employee.id, deptId: dept.id, type: "in", timestamp: new Date().toISOString(), lat: location?.lat ?? null, lng: location?.lng ?? null, photo, elapsedSec, withinWindow: elapsedSec <= 300 });
    setStage("idle"); setLocation(null); setPhoto(null); setStartedAt(null);
  };

  const cancel = () => { stopCamera(); setStage("idle"); setLocation(null); setPhoto(null); setStartedAt(null); };

  const mm = String(Math.floor(secondsLeft / 60)).padStart(2, "0");
  const ss = String(secondsLeft % 60).padStart(2, "0");

  return (
    <div>
      <p className="text-xs uppercase tracking-wide text-slate-400 font-medium mb-2 px-1">Check in / check out</p>

      {stage === "idle" && (
        <div className="bg-white rounded-xl border border-slate-200 p-5 mb-5 space-y-2.5">
          <button onClick={startCheckin} className={`w-full flex items-center justify-center gap-2 py-3 rounded-lg ${colors.bg} text-white text-sm font-semibold`}>
            <MapPin size={16} />Check in now
          </button>
          <button onClick={checkOut} className="w-full flex items-center justify-center gap-2 py-3 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium">Check out</button>
          <p className="text-[11px] text-slate-400 text-center pt-1">Live camera photo only — no uploading from your album. You have 5 minutes to finish once you start.</p>
        </div>
      )}

      {stage !== "idle" && stage !== "done" && (
        <div className={`flex items-center justify-center gap-1.5 rounded-lg px-3 py-2 mb-3 text-sm font-mono font-semibold ${overWindow ? "bg-rose-50 text-rose-600" : "bg-amber-50 text-amber-700"}`}>
          <CalendarClock size={14} />
          {overWindow ? "Over the 5-minute window" : `${mm}:${ss} remaining`}
        </div>
      )}

      {stage === "locating" && (
        <div className="bg-white rounded-xl border border-slate-200 p-6 mb-5 text-center">
          <MapPin className="mx-auto mb-2 text-slate-400 animate-pulse" size={22} />
          <p className="text-sm text-slate-500">Getting your location…</p>
        </div>
      )}

      {stage === "manualLoc" && (
        <div className="bg-white rounded-xl border border-slate-200 p-4 mb-5">
          <p className="text-xs text-amber-600 mb-3">⚠ {locError}</p>
          <p className="text-xs text-slate-500 mb-2">Enter coordinates manually to continue this demo (in production, this step won't be needed).</p>
          <div className="grid grid-cols-2 gap-2 mb-3">
            <input value={manualLat} onChange={(e) => setManualLat(e.target.value)} placeholder="Latitude" className="px-3 py-2 rounded-lg border border-slate-200 text-sm" />
            <input value={manualLng} onChange={(e) => setManualLng(e.target.value)} placeholder="Longitude" className="px-3 py-2 rounded-lg border border-slate-200 text-sm" />
          </div>
          <button
            onClick={() => { setLocation({ lat: Number(manualLat) || 1.4927, lng: Number(manualLng) || 103.7414 }); setStage("camera"); }}
            className={`w-full py-2.5 rounded-lg ${colors.bg} text-white text-sm font-semibold`}
          >
            Continue
          </button>
        </div>
      )}

      {stage === "camera" && (
        <div className="bg-white rounded-xl border border-slate-200 p-4 mb-5">
          {location && <p className="text-xs text-slate-500 mb-2 font-mono">📍 {location.lat.toFixed(5)}, {location.lng.toFixed(5)}</p>}
          {camError ? (
            <div className="bg-slate-50 rounded-lg p-6 text-center text-xs text-slate-500 mb-3">
              Camera unavailable: {camError}<br />Allow camera access in your browser to continue.
            </div>
          ) : (
            <video ref={videoRef} autoPlay playsInline muted className="w-full rounded-lg bg-slate-900 aspect-[4/3] object-cover mb-3" />
          )}
          <div className="flex gap-2">
            <button onClick={cancel} className="px-4 py-2.5 rounded-lg border border-slate-200 text-slate-500 text-sm font-medium">Cancel</button>
            <button onClick={capturePhoto} disabled={!!camError} className={`flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg ${colors.bg} text-white text-sm font-semibold disabled:opacity-40`}>
              <Camera size={16} />Take photo
            </button>
          </div>
        </div>
      )}

      {stage === "done" && (
        <div className="bg-white rounded-xl border border-slate-200 p-4 mb-5">
          {photo && <img src={photo} alt="check-in" className="w-full rounded-lg mb-3 aspect-[4/3] object-cover" />}
          <p className="text-xs text-slate-500 mb-3">{location ? `📍 ${location.lat.toFixed(5)}, ${location.lng.toFixed(5)}` : "Location unavailable"}</p>
          <button onClick={confirmCheckin} className={`w-full flex items-center justify-center gap-2 py-2.5 rounded-lg ${colors.bg} text-white text-sm font-semibold`}>Confirm check-in</button>
        </div>
      )}

      <p className="text-xs uppercase tracking-wide text-slate-400 font-medium mb-2 px-1 mt-6">Recent activity</p>
      <div className="space-y-2">
        {myCheckins.length === 0 && <p className="text-sm text-slate-400 px-1">No check-ins yet.</p>}
        {myCheckins.map((c) => (
          <div key={c.id} className="bg-white rounded-lg border border-slate-200 p-3 flex items-center gap-3">
            {c.photo ? <img src={c.photo} className="w-10 h-10 rounded-md object-cover" /> : <div className="w-10 h-10 rounded-md bg-slate-100 flex items-center justify-center text-slate-300"><MapPin size={16} /></div>}
            <div className="flex-1 min-w-0">
              <p className="text-sm font-medium text-slate-700">{c.type === "in" ? "Checked in" : "Checked out"}</p>
              <p className="text-xs text-slate-400">{new Date(c.timestamp).toLocaleString()}</p>
            </div>
            {c.type === "in" && <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${c.withinWindow ? "bg-emerald-50 text-emerald-600" : "bg-rose-50 text-rose-600"}`}>{c.withinWindow ? `within ${c.elapsedSec}s` : "late"}</span>}
          </div>
        ))}
      </div>
    </div>
  );
}

function StaffLeaderboard({ employees, departments, deptById, employeePoints, employee, colors }) {
  const [view, setView] = useState("overall");
  const ranked = [...employees].map((e) => ({ ...e, pts: employeePoints(e.id).percentage })).sort((a, b) => b.pts - a.pts);

  const deptAvg = (deptId) => {
    const emps = employees.filter((e) => e.deptId === deptId);
    if (emps.length === 0) return 0;
    return Math.round(emps.reduce((a, e) => a + employeePoints(e.id).percentage, 0) / emps.length);
  };
  const deptRanked = [...departments].map((d) => ({ ...d, avg: deptAvg(d.id) })).sort((a, b) => b.avg - a.avg);

  return (
    <div>
      <div className="flex bg-slate-100 rounded-lg p-1 mb-3">
        <button onClick={() => setView("overall")} className={`flex-1 py-1.5 rounded-md text-xs font-medium ${view === "overall" ? "bg-white shadow-sm text-slate-900" : "text-slate-500"}`}>Company-wide</button>
        <button onClick={() => setView("dept")} className={`flex-1 py-1.5 rounded-md text-xs font-medium ${view === "dept" ? "bg-white shadow-sm text-slate-900" : "text-slate-500"}`}>By department</button>
      </div>

      {view === "overall" ? (
        <div className="space-y-1.5">
          {ranked.slice(0, 25).map((e, idx) => {
            const isMe = e.id === employee.id;
            const dc = deptTheme(deptById[e.deptId]);
            return (
              <div key={e.id} className={`flex items-center gap-3 rounded-lg border p-3 ${isMe ? `${colors.light} ${colors.border}` : "bg-white border-slate-200"}`}>
                <span className={`font-mono text-xs w-5 text-center font-semibold ${idx < 3 ? "text-amber-500" : "text-slate-400"}`}>{idx + 1}</span>
                <div className="flex-1 min-w-0">
                  <p className={`text-sm font-medium truncate ${isMe ? colors.text : "text-slate-700"}`}>{e.name}{isMe ? " (you)" : ""}</p>
                  <span className={`text-[10px] ${dc.text}`}>{deptById[e.deptId].name}</span>
                </div>
                <PercentBar value={e.pts} width={80} highlight={idx < 3} />
              </div>
            );
          })}
        </div>
      ) : (
        <div className="space-y-4">
          <div className="space-y-1.5 mb-2">
            {deptRanked.map((d, idx) => {
              const c = deptTheme(d);
              return (
                <div key={d.id} className="flex items-center gap-3 bg-white rounded-lg border border-slate-200 p-3">
                  <span className={`font-mono text-xs w-5 text-center font-semibold ${idx === 0 ? "text-amber-500" : "text-slate-400"}`}>{idx + 1}</span>
                  <span className={`flex-1 text-sm font-medium flex items-center gap-1.5`}><span className={`w-2 h-2 rounded-full ${c.bg}`} />{d.name}</span>
                  <PercentBar value={d.avg} width={90} colorClass={c.bg} />
                </div>
              );
            })}
          </div>
          {departments.map((d) => {
            const c = deptTheme(d);
            const deptStaff = ranked.filter((e) => e.deptId === d.id);
            return (
              <div key={d.id}>
                <p className={`text-xs font-medium mb-1.5 px-1 ${c.text}`}>{d.name}</p>
                <div className="space-y-1">
                  {deptStaff.map((e, idx) => (
                    <div key={e.id} className={`flex items-center gap-2 rounded-lg border p-2.5 text-sm ${e.id === employee.id ? `${colors.light} ${colors.border}` : "bg-white border-slate-200"}`}>
                      <span className="font-mono text-[11px] w-4 text-center text-slate-400">{idx + 1}</span>
                      <span className="flex-1 truncate">{e.name}{e.id === employee.id ? " (you)" : ""}</span>
                      <PercentBar value={e.pts} width={70} />
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

            <textarea value={r.remark} onChange={(e) => updateReview(r.id, { remark: e.target.value })} className="w-full text-sm text-slate-700 border-0 focus:outline-none focus:ring-1 focus:ring-teal-600 rounded resize-none" rows={2} />
          </div>
        ))}
      </div>
    </div>
  );
}

    { id: "overview", label: "Overview", icon: LayoutGrid },
    { id: "companies", label: "Companies", icon: Building },
    { id: "people", label: "People", icon: Users },
    { id: "goals", label: "Goal Settings", icon: Settings },
    { id: "approvals", label: "Approvals", icon: ShieldCheck },
    { id: "checkins", label: "Check-ins", icon: MapPin },
    { id: "rewards", label: "Rewards", icon: Gift },
    { id: "reports", label: "Reports", icon: FileSpreadsheet },
    { id: "leaderboard", label: "Leaderboard", icon: Trophy },

  return (
    <div className="max-w-6xl mx-auto px-6 py-8 flex gap-6">

          {NAV.map((n) => {
            const Icon = n.icon;
            const active = tab === n.id;
            return (
              <button key={n.id} onClick={() => setTab(n.id)} className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-left transition-colors ${active ? "bg-slate-900 text-white font-medium" : "text-slate-600 hover:bg-slate-100"}`}>
                <Icon size={15} />{n.label}
              </button>

          })}

      <div className="flex-1 min-w-0">
        {tab === "overview" && <AdminOverview {...props} />}
        {tab === "companies" && <AdminCompanies {...props} />}
        {tab === "people" && <AdminPeople {...props} activeCompanyId={activeCompanyId} switchCompany={switchCompany} activeDeptId={activeDeptId} setActiveDeptId={setActiveDeptId} />}
        {tab === "goals" && <AdminGoalSettings {...props} activeCompanyId={activeCompanyId} switchCompany={switchCompany} activeDeptId={activeDeptId} setActiveDeptId={setActiveDeptId} />}
        {tab === "approvals" && <AdminApprovals {...props} activeCompanyId={activeCompanyId} switchCompany={switchCompany} activeDeptId={activeDeptId} setActiveDeptId={setActiveDeptId} />}
        {tab === "checkins" && <AdminCheckins {...props} activeDeptId={activeDeptId} setActiveDeptId={setActiveDeptId} />}
        {tab === "rewards" && <AdminRewards {...props} activeCompanyId={activeCompanyId} switchCompany={switchCompany} />}
        {tab === "reports" && <AdminReports {...props} activeCompanyId={activeCompanyId} switchCompany={switchCompany} />}
        {tab === "leaderboard" && <AdminLeaderboard {...props} activeCompanyId={activeCompanyId} switchCompany={switchCompany} />}
      </div>
    </div>
  );
}

function PercentBar({ value, colorClass = "bg-teal-600", width = 90, highlight = false }) {
  const pct = Math.max(0, Math.min(100, value));
  return (
    <div className={`relative h-5 rounded-full bg-slate-100 overflow-hidden ${highlight ? "ring-1 ring-amber-300" : ""}`} style={{ width }}>
      <div className={`h-full ${colorClass}`} style={{ width: `${pct}%` }} />
      <span className="absolute inset-0 flex items-center justify-center text-[10px] font-mono font-semibold text-slate-700">{value}%</span>
    </div>
  );
}

function Lightbox({ content, onClose }) {
  if (!content) return null;
  return (
    <div className="fixed inset-0 bg-slate-900/70 flex items-center justify-center z-50 p-6" onClick={onClose}>
      <div
        className="bg-white rounded-xl overflow-auto p-5"
        style={{ width: "min(90vw, 900px)", height: "min(85vh, 700px)", minWidth: 320, minHeight: 220, resize: "both" }}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="flex items-center justify-between mb-3">
          <p className="text-sm font-semibold text-slate-700">{content.title}</p>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><XCircle size={18} /></button>
        </div>
        {content.type === "image" ? (
          <img src={content.src} className="w-full rounded-lg object-contain" />
        ) : content.type === "file" ? (
          <a href={content.src} target="_blank" rel="noreferrer" className="inline-flex items-center gap-2 text-sm text-teal-700 hover:underline">
            <Upload size={16} />
            Open "{content.title}" in a new tab
          </a>
        ) : (
          <p className="text-sm text-slate-700 whitespace-pre-wrap">{content.text}</p>
        )}
        <p className="text-[10px] text-slate-300 mt-2">Drag the bottom-right corner to resize</p>
      </div>
    </div>
  );
}

function SectionTitle({ children, sub }) {
  return (
    <div className="mb-4">
      <h2 className="font-display text-lg font-semibold tracking-tight">{children}</h2>
      {sub && <p className="text-sm text-slate-400 mt-0.5">{sub}</p>}
    </div>
  );
}

function AdminCompanies({ companies, addCompany, updateCompany, archiveCompany, restoreCompany, departments, employees, deptById, notify }) {
  const [showAdd, setShowAdd] = useState(false);
  const [name, setName] = useState("");
  const [description, setDescription] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editName, setEditName] = useState("");

  const submit = () => {
    if (!name.trim()) return;
    addCompany(name.trim(), description.trim());
    notify(`Added company "${name.trim()}"`);
    setName(""); setDescription("");
    setShowAdd(false);
  };

  const saveEdit = (id) => {
    if (!editName.trim()) return;
    updateCompany(id, { name: editName.trim() });
    notify("Company renamed");
    setEditingId(null);
  };

  return (
    <div>
      <SectionTitle sub="Set up companies here — no coding needed. Each company gets its own departments, goals, and people.">Companies</SectionTitle>

      <button onClick={() => setShowAdd((s) => !s)} className="flex items-center gap-1.5 px-4 py-2.5 rounded-lg bg-slate-900 text-white text-sm font-medium mb-4"><Plus size={15} />Add company</button>

      {showAdd && (
        <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-4 mb-4">
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Company name" className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm mb-2" />
          <input value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Description (optional)" className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm mb-3" />
          <div className="flex gap-2">
            <button onClick={submit} className="px-4 py-2 rounded-lg bg-slate-900 text-white text-sm font-medium">Add</button>
            <button onClick={() => setShowAdd(false)} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium">Cancel</button>
          </div>
        </div>
      )}

      <div className="space-y-3">
        {companies.map((c) => {
          const deptCount = departments.filter((d) => d.companyId === c.id && d.active !== false).length;
          const empCount = employees.filter((e) => deptById[e.deptId]?.companyId === c.id && e.active !== false).length;
          return (
            <div key={c.id} className={`bg-white rounded-xl border p-4 flex items-center justify-between ${c.active === false ? "border-slate-100 opacity-60" : "border-slate-200"}`}>
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-slate-900 flex items-center justify-center shrink-0"><Building className="text-white" size={16} /></div>
                <div>
                  {editingId === c.id ? (
                    <div className="flex items-center gap-2">
                      <input value={editName} onChange={(e) => setEditName(e.target.value)} className="px-2 py-1 rounded-md border border-slate-200 text-sm" autoFocus />
                      <button onClick={() => saveEdit(c.id)} className="text-xs font-medium text-emerald-600 hover:underline">Save</button>
                      <button onClick={() => setEditingId(null)} className="text-xs font-medium text-slate-400 hover:underline">Cancel</button>
                    </div>
                  ) : (
                    <p className="text-sm font-semibold text-slate-800">{c.name}{c.active === false && <span className="ml-2 text-[11px] font-normal text-slate-400">(archived)</span>}</p>
                  )}
                  <p className="text-xs text-slate-400">{deptCount} departments · {empCount} staff</p>
                  {c.description && <p className="text-xs text-slate-500 mt-0.5">{c.description}</p>}
                </div>
              </div>
              <div className="flex items-center gap-1">
                {editingId !== c.id && (
                  <button onClick={() => { setEditingId(c.id); setEditName(c.name); }} title="Rename" className="p-1.5 rounded-md text-slate-400 hover:bg-slate-100 hover:text-slate-600"><Pencil size={14} /></button>
                )}
                {c.active === false ? (
                  <button onClick={() => { restoreCompany(c.id); notify(`Restored "${c.name}"`); }} title="Restore" className="p-1.5 rounded-md text-emerald-600 hover:bg-emerald-50"><Undo2 size={14} /></button>
                ) : (
                  <button onClick={() => { archiveCompany(c.id); notify(`Archived "${c.name}"`); }} title="Archive" className="p-1.5 rounded-md text-slate-400 hover:bg-rose-50 hover:text-rose-500"><Trash2 size={14} /></button>
                )}

            </div>
          );

function DeptTabs({ departments, activeDeptId, setActiveDeptId }) {
  return (
    <div className="flex flex-wrap gap-1.5">
      {departments.filter((d) => d.active !== false).map((d) => {

          <button key={d.id} onClick={() => setActiveDeptId(d.id)} className={`px-3 py-1.5 rounded-full text-xs font-medium transition-colors ${active ? `${c.bg} text-white` : `${c.light} ${c.text}`}`}>{d.name}</button>

      {companies.filter((c) => c.active !== false).map((c) => {

        return (

function AdminOverview({ companies, departments, employees, employeePoints }) {
  const deptAvg = (deptId) => {
    const emps = employees.filter((e) => e.deptId === deptId && e.active !== false);
    if (emps.length === 0) return 0;
    return Math.round(emps.reduce((a, e) => a + employeePoints(e.id).percentage, 0) / emps.length);
  };
  const deptCount = (deptId) => employees.filter((e) => e.deptId === deptId && e.active !== false).length;
  const activeDepartments = departments.filter((d) => d.active !== false);
  const activeEmployees = employees.filter((e) => e.active !== false);

  return (
    <div>
      <SectionTitle sub="Average performance % per department, grouped by company — the quick view of which department performs best.">Overview</SectionTitle>
      <p className="flex items-center gap-1.5 text-sm text-slate-500 mb-4 px-1">
        <Users size={14} className="text-slate-400" />
        <span className="font-mono font-semibold text-slate-700">{activeEmployees.length}</span> employees total across {companies.filter((c) => c.active !== false).length} companies
      </p>

      <div className="space-y-5">
        {companies.filter((c) => c.active !== false).map((company) => {
          const companyDepts = activeDepartments.filter((d) => d.companyId === company.id);
          if (companyDepts.length === 0) return null;
          return (
            <div key={company.id} className="bg-white rounded-xl border border-slate-200 p-5">
              <p className="font-display font-semibold text-sm text-slate-800 mb-3 flex items-center gap-1.5">
                <Building size={14} className="text-slate-400" />
                {company.name}
              </p>
              <div className="space-y-3">
                {companyDepts.map((d) => {
                  const c = deptTheme(d);
                  const avg = deptAvg(d.id);
                  return (
                    <div key={d.id} className="flex items-center gap-3">
                      <span className="text-sm text-slate-600 w-28 shrink-0">{d.name}</span>
                      <span className="font-mono text-[11px] text-slate-400 w-16 shrink-0">{deptCount(d.id)} staff</span>
                      <div className="flex-1 h-2 bg-slate-100 rounded-full overflow-hidden"><div className={`h-full ${c.bg}`} style={{ width: `${Math.min(avg, 100)}%` }} /></div>
                      <span className="font-mono text-xs font-semibold w-10 text-right">{avg}%</span>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

const TAILWIND_HEX = {
  teal: "#14b8a6", rose: "#f43f5e", pink: "#ec4899", fuchsia: "#d946ef", purple: "#a855f7",
  violet: "#8b5cf6", indigo: "#6366f1", blue: "#3b82f6", sky: "#0ea5e9", cyan: "#06b6d4",
  emerald: "#10b981", green: "#22c55e", lime: "#65a30d", yellow: "#eab308", amber: "#f59e0b",
  orange: "#f97316", red: "#ef4444", slate: "#64748b",
};
const hexToRgb = (hex) => { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const deptSlug = (id) => String(id).replace(/[^a-zA-Z0-9]/g, "");
// Any department's true picked color, resolved to a dedicated set of CSS classes generated at
// render time (see deptStylesheet below) — not a preset match. Same {bg, light, text, border} shape
// every call site already expects, so nothing downstream needs to change.
function deptTheme(dept) {
  const hex = dept.colorHex || TAILWIND_HEX[dept.color] || TAILWIND_HEX.teal;
  const slug = deptSlug(dept.id);
  return { hex, bg: `dept-${slug}-bg`, light: `dept-${slug}-light`, text: `dept-${slug}-text`, border: `dept-${slug}-border` };
}
function deptStylesheet(departments) {
  return departments.map((d) => {
    const hex = d.colorHex || TAILWIND_HEX[d.color] || TAILWIND_HEX.teal;
    const [r, g, b] = hexToRgb(hex);
    const slug = deptSlug(d.id);
    return `.dept-${slug}-bg{background-color:${hex};} .dept-${slug}-light{background-color:rgba(${r},${g},${b},0.13);} .dept-${slug}-text{color:${hex};} .dept-${slug}-border{border-color:rgba(${r},${g},${b},0.35);}`;
  }).join("\n");
}

        <p className="text-xs uppercase tracking-wide text-slate-400 font-medium mb-2">Active</p>
        <div className="space-y-1.5 mb-4">
          {active.map((d) => (
            <div key={d.id} className="flex items-center justify-between bg-slate-50 rounded-lg px-3 py-2">

          {active.length === 0 && <p className="text-xs text-slate-400">No active departments.</p>}

        {archived.length > 0 && (
          <>
            <p className="text-xs uppercase tracking-wide text-slate-400 font-medium mb-2">Archived</p>
            <div className="space-y-1.5">
              {archived.map((d) => (
                <div key={d.id} className="flex items-center justify-between bg-slate-50 rounded-lg px-3 py-2 opacity-70">
                  <span className="text-sm text-slate-500">{d.name}</span>
                  <button onClick={() => { restoreDepartment(d.id); notify(`Restored department "${d.name}"`); }} title="Restore" className="p-1 rounded-md text-emerald-600 hover:bg-emerald-50"><Undo2 size={14} /></button>
                </div>
              ))}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

    addDepartment(name.trim(), hex, companyId);

  return (
    <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-4 mb-4">

        <button onClick={submit} className="px-3 py-2 rounded-lg bg-slate-900 text-white text-sm font-medium">Add</button>

function AddEmployeeForm({ departments, companies, activeCompanyId, activeDeptId, addEmployee, notify, onDone }) {
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [role, setRole] = useState("staff");
  const [companyId, setCompanyId] = useState(activeCompanyId);
  const deptsInThisCompany = departments.filter((d) => d.companyId === companyId && d.active !== false);
  const [deptId, setDeptId] = useState(activeDeptId);
  const [password, setPassword] = useState("");

  const changeCompany = (newCompanyId) => {
    setCompanyId(newCompanyId);
    const firstDept = departments.find((d) => d.companyId === newCompanyId && d.active !== false);
    setDeptId(firstDept?.id || "");
  };

  const [saving, setSaving] = useState(false);
  const submit = async () => {
    if (!name.trim() || !email.trim() || !password.trim() || !deptId || saving) return;
    setSaving(true);
    const emp = await addEmployee(name.trim(), email.trim(), role, deptId, password.trim(), companyId);
    setSaving(false);
    if (!emp) return; // addEmployee already showed the error via notify()
    notify(`Added ${name.trim()} (${email.trim()})`);
    setName(""); setEmail(""); setPassword("");
    onDone();
  };

  return (
    <div className="bg-white rounded-xl border-2 border-dashed border-slate-200 p-4 mb-4">
      <p className="text-sm font-semibold mb-3">New employee</p>
      <div className="grid grid-cols-2 gap-2 mb-2">
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Full name" className="px-3 py-2 rounded-lg border border-slate-200 text-sm" />
        <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Email address" className="px-3 py-2 rounded-lg border border-slate-200 text-sm" />
      </div>
      <div className="grid grid-cols-2 gap-2 mb-2">
        <div>
          <label className="text-[11px] text-slate-400">Access rights</label>
          <select value={role} onChange={(e) => setRole(e.target.value)} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm">
            <option value="staff">Staff</option>
            <option value="ceo">Admin</option>
          </select>
        </div>
        <div>
          <label className="text-[11px] text-slate-400">Company</label>
          <select value={companyId} onChange={(e) => changeCompany(e.target.value)} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm">
            {companies.filter((c) => c.active !== false).map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
          </select>
        </div>
      </div>
      <div className="mb-3">
        <label className="text-[11px] text-slate-400">Department — each person works in exactly one company and one department</label>
        <select value={deptId} onChange={(e) => setDeptId(e.target.value)} className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm">
          {deptsInThisCompany.length === 0 && <option value="">No departments in this company yet</option>}
          {deptsInThisCompany.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
        </select>
      </div>
      <div className="mb-3">
        <label className="text-[11px] text-slate-400">Password (set by admin)</label>
        <input type="text" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Set an initial password" className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm" />
      </div>
      <div className="flex gap-2">
        <button onClick={submit} disabled={saving} className="px-4 py-2 rounded-lg bg-slate-900 text-white text-sm font-medium disabled:opacity-50">{saving ? "Creating…" : "Create account"}</button>
        <button onClick={onDone} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium">Cancel</button>
      </div>
    </div>
  );
}

function AdminGoalSettings({ departments, employees, activeCompanyId, switchCompany, companies, activeDeptId, setActiveDeptId, goals, addGoal, updateGoal, archiveGoal, restoreGoal, addTaskToGoal, removeTaskFromGoal, updateTaskWeight, updateTaskRequiresAttachment, updateTaskRequiresRemark, updateTaskText, toggleAssignment, notify, getMonthView, commitCurrentMonthEdit, scheduleFutureVersion }) {

  const deptEmployees = employees.filter((e) => e.deptId === activeDeptId && e.active !== false);

  return (
    <div>
      <SectionTitle sub="Annual goals repeat monthly — pick a month tab to view or edit that month. Smaller project goals below have their own fixed dates.">Goal settings</SectionTitle>

      <div className="flex items-center justify-between mb-3">
        <DeptTabs departments={deptsInCompany} activeDeptId={activeDeptId} setActiveDeptId={setActiveDeptId} />
        <label className="flex items-center gap-1.5 text-xs text-slate-500 shrink-0 ml-3">
          <input type="checkbox" checked={showArchived} onChange={(e) => setShowArchived(e.target.checked)} className="accent-slate-600" />
          Show archived
        </label>
      </div>

      <div className="space-y-4 mt-4">
        {deptGoals.map((goal) => (
          goal.isAnnual ? (
            <AnnualGoalEditorCard

            />

              updateTaskRequiresAttachment={updateTaskRequiresAttachment} updateTaskRequiresRemark={updateTaskRequiresRemark} updateTaskText={updateTaskText} toggleAssignment={toggleAssignment} notify={notify}

      )}
    </div>
