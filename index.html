const pad = (n) => String(n).padStart(2, "0");
const isoDate = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtDate = (iso) => fmtDMY(iso);
const fmtDMY = (iso) => { if (!iso) return ""; const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; };
const addDays = (iso, days) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + days); return isoDate(d); };
const currentIsoMonth = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const monthLabel = (isoMonth) => { const [y, m] = isoMonth.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" }); };
const monthShortLabel = (isoMonth) => { const [y, m] = isoMonth.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: "short" }); };
const nextIsoMonth = (isoMonth) => { const [y, m] = isoMonth.split("-").map(Number); const d = new Date(y, m, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const endOfMonth = (isoMonth) => { const [y, m] = isoMonth.split("-").map(Number); return isoDate(new Date(y, m, 0)); };

// Attachments are stored as a path in the private "task-attachments" Supabase Storage bucket (not
// the file itself), so goal_records.attachment_url just holds that path string. These helpers turn
// a stored path back into something displayable without a round-trip: the filename after stripping
// our "<timestamp>-" prefix, and whether it looks like an image (to decide thumbnail vs. generic icon).
const attachmentFileName = (path) => { if (!path) return ""; const last = path.split("/").pop() || path; return last.replace(/^\d+-/, ""); };
const attachmentIsImage = (path) => /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(path || "");
const monthsOfYear = (year) => Array.from({ length: 12 }, (_, i) => `${year}-${pad(i + 1)}`);
const isoMonthOf = (iso) => iso.slice(0, 7); // "2026-04-15" -> "2026-04"
const monthsInRange = (startDate, endDate) => {
  const months = [];
  let cursor = isoMonthOf(startDate);
  const end = isoMonthOf(endDate);
  let guard = 0;
  while (cursor <= end && guard < 60) {
    months.push(cursor);
    cursor = nextIsoMonth(cursor);
    guard++;
  }
  return months;
};
const compareIsoMonth = (a, b) => a === b ? 0 : (a < b ? -1 : 1);

let idCounter = 10000;
const nextId = (prefix) => `${prefix}-${idCounter++}`;

// ---------------- Seed builder for goals / records / checkins / reviews / rewards ----------------

function buildSeedState(employees) {
  const today = new Date();
  const goals = [];
  const goalRecords = {};
  const checkins = [];
  const reviews = [];
  const rewards = [];

  const setRecord = (empId, goalId, taskId, patch) => {
    const k = `${empId}::${goalId}::${taskId}`;
    goalRecords[k] = { done: false, approval: "none", remark: "", adminRemark: "", submittedAt: null, awardedPoints: null, attachment: null, noAttachmentReason: false, ...patch };
  };

  DEPARTMENTS_SEED.forEach((dept) => {
    const deptEmployees = employees.filter((e) => e.deptId === dept.id);

    // Baseline "team goal" — assigned to everyone in the department, the quick department-wide scorecard.
    // This is the goal type that follows the annual-with-monthly-repeat model: `tasks`/`assignedEmployeeIds`
    // represent the LIVE current month; `monthlyHistory` holds frozen past months; `futureVersions` holds
    // changes management has already scheduled for months ahead. startDate/endDate span the WHOLE annual
    // range (used to generate month tabs) — not just the current month.
    const annualSpanStart = isoDate(new Date(today.getFullYear(), 0, 1));
    const annualSpanEnd = isoDate(new Date(today.getFullYear(), 11, 31));
    const currentTasks = BASELINE_TASKS[dept.id].map((t) => ({ id: nextId("task"), text: t.text, weight: t.weight, requiresAttachment: !!t.requiresAttachment, requiresRemark: !!t.requiresRemark }));
    const currentAssigned = deptEmployees.map((e) => e.id);
    const baseline = {
      id: nextId("goal"),
      deptId: dept.id,
      name: `${dept.name} Team Goal — ${today.getFullYear()}`,
      description: `Core monthly scorecard for the whole ${dept.name} team.`,
      isTeamGoal: true,
      autoAssignWholeDept: true,
      isAnnual: true,
      active: true,
      startDate: annualSpanStart,
      endDate: annualSpanEnd,
      reviewCutoffOffsetDays: 5,
      tasks: currentTasks,
      assignedEmployeeIds: currentAssigned,
      monthlyHistory: {},
      futureVersions: [],
    };

    // Seed frozen history for every month from January up to (not including) the current month
    const curIsoMonth = currentIsoMonth();
    monthsInRange(annualSpanStart, annualSpanEnd).filter((m) => m < curIsoMonth).forEach((histMonth, monthIdx) => {
      const histTasks = currentTasks; // same task definitions carried back for simplicity of the demo
      const records = {};
      currentAssigned.forEach((empId, empIdx) => {
        records[empId] = {};
        histTasks.forEach((task, taskIdx) => {
          const roll = (empIdx * 5 + taskIdx * 11 + monthIdx * 3 + dept.id.length) % 10;
          if (roll < 6) records[empId][task.id] = { done: true, approval: "approved", awardedPoints: task.weight };
          else if (roll < 8) records[empId][task.id] = { done: true, approval: "approved", awardedPoints: Math.round(task.weight * 0.6) };
          else records[empId][task.id] = { done: false, approval: "none", awardedPoints: null };
        });
      });
      baseline.monthlyHistory[histMonth] = { tasks: histTasks, assignedEmployeeIds: currentAssigned, records };
    });
    goals.push(baseline);

    // Extra goal — assigned to a subset only
    const extra = EXTRA_GOAL[dept.id];
    const assignedSubset = deptEmployees.slice(0, Math.max(2, Math.floor(deptEmployees.length * 0.35)));
    const extraEndDate = extra.endsPast ? isoDate(new Date(today.getFullYear(), today.getMonth(), 0)) : isoDate(new Date(today.getFullYear(), today.getMonth() + 1, 15));
    const extraGoal = {
      id: nextId("goal"),
      deptId: dept.id,
      name: extra.name,
      description: extra.desc,
      isTeamGoal: false,
      active: true,
      startDate: isoDate(new Date(today.getFullYear(), today.getMonth() - (extra.endsPast ? 2 : 0), 1)),
      endDate: extraEndDate,
      reviewCutoffDate: addDays(extraEndDate, 5),
      tasks: extra.tasks.map((t) => ({ id: nextId("task"), text: t.text, weight: t.weight, requiresAttachment: !!t.requiresAttachment, requiresRemark: !!t.requiresRemark })),
      assignedEmployeeIds: assignedSubset.map((e) => e.id),
    };
    goals.push(extraGoal);

    // Seed records with varied approval states
    [baseline, extraGoal].forEach((goal) => {
      goal.assignedEmployeeIds.forEach((empId, empIdx) => {
        goal.tasks.forEach((task, taskIdx) => {
          const deptSalt = dept.id.charCodeAt(0) + dept.id.length * 5;
          const roll = (empIdx * 7 + taskIdx * 13 + goal.tasks.length + deptSalt) % 10;
          if (roll < 4) setRecord(empId, goal.id, task.id, { done: true, approval: "approved", awardedPoints: task.weight, awardedWeight: task.weight, submittedAt: today.toISOString() });
          else if (roll < 5) setRecord(empId, goal.id, task.id, { done: true, approval: "approved", awardedPoints: Math.round(task.weight * 0.6), awardedWeight: task.weight, remark: "Partial credit — only half delivered", submittedAt: today.toISOString() });
          else if (roll < 7) setRecord(empId, goal.id, task.id, { done: true, approval: "pending", submittedAt: today.toISOString() });
          else if (roll < 8) setRecord(empId, goal.id, task.id, { done: true, approval: "pending", remark: "Needs more detail before I can approve this", submittedAt: today.toISOString() });
          // else: left untouched (not done)
        });
      });
    });

    // Seed check-ins for a few employees in this department
    deptEmployees.slice(0, 4).forEach((emp, idx) => {
      for (let d = 0; d < 3; d++) {
        const day = new Date(today);
        day.setDate(day.getDate() - d);
        day.setHours(9, 15 + idx * 4, 0, 0);
        const lat = 1.4927 + (Math.random() - 0.5) * 0.01;
        const lng = 103.7414 + (Math.random() - 0.5) * 0.01;
        checkins.push({ id: nextId("ci"), empId: emp.id, deptId: dept.id, type: "in", timestamp: day.toISOString(), lat, lng, photo: null, elapsedSec: 60 + idx * 20, withinWindow: true });
        const out = new Date(day);
        out.setHours(18, 5, 0, 0);
        checkins.push({ id: nextId("ci"), empId: emp.id, deptId: dept.id, type: "out", timestamp: out.toISOString(), lat: lat + 0.001, lng: lng + 0.001, photo: null, elapsedSec: 0, withinWindow: true });
      }
    });

    // Seed a review for one employee
    if (deptEmployees[0]) {
      reviews.push({
        id: nextId("rv"),
        empId: deptEmployees[0].id,
        month: today.toLocaleDateString(undefined, { month: "long", year: "numeric" }),
        remark: "5-star review from a client — praised responsiveness and follow-through.",
        screenshot: "google-review-screenshot.png",
        createdAt: today.toISOString(),
      });
    }
  });

  // Seed rewards: a couple department, a couple individual
  rewards.push({ id: nextId("rw"), targetType: "department", deptId: "sales", empId: null, month: today.toLocaleDateString(undefined, { month: "long", year: "numeric" }), amount: 500, note: "Best-performing department this month" });
  rewards.push({ id: nextId("rw"), targetType: "individual", deptId: null, empId: employees.find((e) => e.deptId === "marketing")?.id, month: today.toLocaleDateString(undefined, { month: "long", year: "numeric" }), amount: 150, note: "Top individual performer — Marketing" });

  // Seed one example reward scheme — Sales dept, tied to the Sales Team Goal, so the Rewards tab has something to show
  const rewardSchemes = [];
  const salesGoal = goals.find((g) => g.deptId === "sales" && g.isTeamGoal);
  if (salesGoal) {
    const salesEmployeeIds = employees.filter((e) => e.deptId === "sales").map((e) => e.id);
    rewardSchemes.push({
      id: nextId("rwscheme"), deptId: "sales", companyId: "ingenious", goalId: salesGoal.id,
      startDate: isoDate(new Date(today.getFullYear(), 0, 1)), endDate: isoDate(new Date(today.getFullYear(), 11, 31)),
      baseAmount: 500, active: true,
      enrolledEmployeeIds: salesEmployeeIds.slice(0, 4),
      employeeOverrides: {},
      futureRewardPercent: null, futureBaseAmount: null, futureEffectiveMonth: null,
    });
  }

  return { goals, goalRecords, checkins, reviews, rewards, rewardSchemes };
}

// ---------------- Root ----------------

function KPIApp() {
  const [companies, setCompanies] = useState([]);
  const [departments, setDepartments] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [goals, setGoals] = useState([]);
  const [goalRecords, setGoalRecords] = useState({});
  const [checkins, setCheckins] = useState([]);
  const [reviews, setReviews] = useState([]);
  const [rewards, setRewards] = useState([]);
  const [rewardSchemes, setRewardSchemes] = useState([]);
  const [session, setSession] = useState(null); // {role, employeeId, name, email, deptId, companyId}
  const [authLoading, setAuthLoading] = useState(true);
  const [dataLoading, setDataLoading] = useState(true);

  // Look up the employees row for a logged-in Supabase auth user and turn it into our session shape.
  const hydrateSessionFromUser = async (authUser) => {
    if (!authUser) { setSession(null); return; }
    const { data: emp, error: empError } = await supabaseClient
      .from("employees")
      .select("*")
      .eq("id", authUser.id)
      .single();
    if (empError || !emp) { setSession(null); return; }
    setSession({
      role: emp.role,
      employeeId: emp.id,
      name: emp.name,
      email: emp.email,
      deptId: emp.dept_id ?? emp.department_id ?? null,
      companyId: emp.company_id ?? null,
    });
  };

  // Real Supabase session: restore it on load, and stay in sync with sign-in/out
  // (including token refresh) for as long as the app is open.
  useEffect(() => {
    let active = true;
    supabaseClient.auth.getSession().then(({ data: { session: authSession } }) => {
      if (!active) return;
      if (authSession && authSession.user) {
        hydrateSessionFromUser(authSession.user).finally(() => active && setAuthLoading(false));
      } else {
        setAuthLoading(false);
      }
    });
    const { data: listener } = supabaseClient.auth.onAuthStateChange((event, authSession) => {
      if (event === "SIGNED_OUT") { setSession(null); return; }
      if (event === "SIGNED_IN" && authSession && authSession.user) {
        hydrateSessionFromUser(authSession.user);
      }
    });
    return () => { active = false; listener.subscription.unsubscribe(); };
  }, []);

  // Core data: once we have a real session, pull companies/departments/employees, plus goals + their
  // tasks/assignments/records, from Supabase — replacing the old demo seed entirely. Reshaped into the
  // exact same nested shape (tasks/assignedEmployeeIds embedded in each goal, records keyed by
  // "empId::goalId::taskId") the rest of the app already expects, so nothing downstream needed to change.
  // monthlyHistory/futureVersions are now real too: goal_month_history holds frozen past-month snapshots
  // (written by the nightly rollover_annual_goals() job) and goal_future_versions holds scheduled changes
  // the admin queued up. Only the live/current month lives directly in goal_tasks/goal_assignments/goal_records.
  useEffect(() => {
    if (!session) { setDataLoading(true); return; }
    let active = true;
    (async () => {
      const [companiesRes, departmentsRes, employeesRes, goalsRes, tasksRes, assignmentsRes, recordsRes, historyRes, futureRes] = await Promise.all([
        supabaseClient.from("companies").select("*"),
        supabaseClient.from("departments").select("*"),
        supabaseClient.from("employees").select("*"),
        supabaseClient.from("goals").select("*"),
        supabaseClient.from("goal_tasks").select("*").order("sort_order", { ascending: true }),
        supabaseClient.from("goal_assignments").select("*"),
        supabaseClient.from("goal_records").select("*"),
        supabaseClient.from("goal_month_history").select("*"),
        supabaseClient.from("goal_future_versions").select("*"),
      ]);
      if (!active) return;
      if (companiesRes.error) console.error("Failed to load companies:", companiesRes.error);
      if (departmentsRes.error) console.error("Failed to load departments:", departmentsRes.error);
      if (employeesRes.error) console.error("Failed to load employees:", employeesRes.error);
      if (goalsRes.error) console.error("Failed to load goals:", goalsRes.error);
      if (tasksRes.error) console.error("Failed to load goal tasks:", tasksRes.error);
      if (assignmentsRes.error) console.error("Failed to load goal assignments:", assignmentsRes.error);
      if (recordsRes.error) console.error("Failed to load goal records:", recordsRes.error);
      if (historyRes.error) console.error("Failed to load goal month history:", historyRes.error);
      if (futureRes.error) console.error("Failed to load goal future versions:", futureRes.error);

      setCompanies((companiesRes.data || []).map((c) => ({
        id: c.id, name: c.name, active: c.active !== false,
      })));
      setDepartments((departmentsRes.data || []).map((d) => ({
        id: d.id, name: d.name, color: d.color || "slate", colorHex: d.color_hex ?? d.colorHex ?? null,
        companyId: d.company_id, active: d.active !== false,
      })));
      setEmployees((employeesRes.data || []).map((e) => ({
        id: e.id, name: e.name, email: e.email, password: null, role: e.role,
        deptId: e.dept_id ?? e.department_id ?? null, active: e.active !== false,
      })));

      const tasksByGoal = {};
      (tasksRes.data || []).forEach((t) => {
        (tasksByGoal[t.goal_id] || (tasksByGoal[t.goal_id] = [])).push({
          id: t.id, text: t.text, weight: Number(t.weight),
          requiresAttachment: !!t.requires_attachment, requiresRemark: !!t.requires_remark,
        });
      });
      const assignedByGoal = {};
      (assignmentsRes.data || []).forEach((a) => {
        (assignedByGoal[a.goal_id] || (assignedByGoal[a.goal_id] = [])).push(a.employee_id);
      });

      // Frozen past-month snapshots. tasks_snapshot entries here carry the *real* task ids they had
      // at rollover time (the rollover function copies them straight from goal_tasks), because
      // records_snapshot is keyed by those same ids — unlike future-version drafts, these can't be
      // given fresh client-side ids without breaking the tasks<->records link.
      const historyByGoal = {};
      (historyRes.data || []).forEach((h) => {
        const tasks = (h.tasks_snapshot || []).map((t) => ({
          id: t.id, text: t.text, weight: Number(t.weight),
          requiresAttachment: !!t.requiresAttachment, requiresRemark: !!t.requiresRemark,
        }));
        (historyByGoal[h.goal_id] || (historyByGoal[h.goal_id] = {}))[h.iso_month] = {
          tasks, assignedEmployeeIds: h.assigned_snapshot || [], records: h.records_snapshot || {},
        };
      });

      // Scheduled future changes. These are just drafts with no records tied to them yet, so it's
      // safe to hand each task a fresh client-side id here.
      const futureByGoal = {};
      (futureRes.data || []).forEach((f) => {
        const tasks = (f.tasks_snapshot || []).map((t) => ({
          id: t.id || nextId("task"), text: t.text, weight: Number(t.weight),
          requiresAttachment: !!t.requiresAttachment, requiresRemark: !!t.requiresRemark,
        }));
        (futureByGoal[f.goal_id] || (futureByGoal[f.goal_id] = [])).push({
          effectiveFromMonth: f.effective_from_month, tasks, assignedEmployeeIds: f.assigned_snapshot || [],
        });
      });

      setGoals((goalsRes.data || []).map((g) => ({
        id: g.id, deptId: g.dept_id, name: g.name, description: g.description || "",
        isTeamGoal: g.is_team_goal, autoAssignWholeDept: g.auto_assign_whole_dept, isAnnual: g.is_annual,
        active: g.active, startDate: g.start_date, endDate: g.end_date,
        reviewCutoffDate: g.review_cutoff_date, reviewCutoffOffsetDays: g.review_cutoff_offset_days,
        liveMonth: g.live_month,
        tasks: tasksByGoal[g.id] || [], assignedEmployeeIds: assignedByGoal[g.id] || [],
        monthlyHistory: historyByGoal[g.id] || {}, futureVersions: futureByGoal[g.id] || [],
      })));

      const mappedRecords = {};
      (recordsRes.data || []).forEach((r) => {
        mappedRecords[`${r.employee_id}::${r.goal_id}::${r.task_id}`] = {
          done: r.done, approval: r.approval, remark: r.remark || "", adminRemark: r.admin_remark || "",
          submittedAt: r.submitted_at, awardedPoints: r.awarded_points, awardedWeight: r.awarded_weight,
          attachment: r.attachment_url, noAttachmentReason: !!r.no_attachment_reason,
        };
      });
      setGoalRecords(mappedRecords);

      setDataLoading(false);
    })();
    return () => { active = false; };
  }, [session?.employeeId]);

  const handleLogout = async () => {
    setSession(null);
    try { await supabaseClient.auth.signOut(); } catch (e) {}
  };

  const deptById = useMemo(() => {
    const m = {};
    departments.forEach((d) => (m[d.id] = d));
    return m;
  }, [departments]);

  const key = (empId, goalId, taskId) => `${empId}::${goalId}::${taskId}`;
  const defaultRecord = () => ({ done: false, approval: "none", remark: "", adminRemark: "", submittedAt: null, awardedPoints: null, awardedWeight: null, attachment: null, noAttachmentReason: false });
  const getRecord = (empId, goalId, taskId) => goalRecords[key(empId, goalId, taskId)] || defaultRecord();

  const isGoalLocked = (goal) => goal.isAnnual ? false : new Date() > new Date(goal.endDate + "T23:59:59");
  // For annual goals, the review window is per-month: end of that month + reviewCutoffOffsetDays.
  const isReviewLocked = (goal, isoMonth) => {
    if (goal.isAnnual) {
      const m = isoMonth || currentIsoMonth();
      const [y, mo] = m.split("-").map(Number);
      const monthEnd = isoDate(new Date(y, mo, 0));
      return new Date() > new Date(addDays(monthEnd, goal.reviewCutoffOffsetDays ?? 5) + "T23:59:59");
    }
    return new Date() > new Date((goal.reviewCutoffDate || goal.endDate) + "T23:59:59");
  };

  // Writes one goal_records row to Supabase. employee_id/goal_id/task_id is this table's natural key
  // (a single record per employee per task), so every write is a whole-row upsert rather than a patch —
  // simplest way to stay correct given how many different fields the various mutators below each touch.
  const persistRecord = (empId, goalId, taskId, record) => {
    supabaseClient.from("goal_records").upsert({
      employee_id: empId,
      goal_id: goalId,
      task_id: taskId,
      done: !!record.done,
      approval: record.approval || "none",
      remark: record.remark || null,
      admin_remark: record.adminRemark || null,
      submitted_at: record.submittedAt || null,
      awarded_points: record.awardedPoints ?? null,
      awarded_weight: record.awardedWeight ?? null,
      attachment_url: record.attachment || null,
      no_attachment_reason: !!record.noAttachmentReason,
    }, { onConflict: "employee_id,goal_id,task_id" }).then(({ error }) => { if (error) console.error("Failed to save goal record:", error); });
  };

  // Toggling: staff use this to tick/untick their own task. Admin uses adminUntick (below) instead, which notifies.
  const toggleTask = (empId, goal, taskId) => {
    if (isGoalLocked(goal)) return;
    const k = key(empId, goal.id, taskId);
    const cur = goalRecords[k] || defaultRecord();
    const merged = cur.done
      ? { ...cur, done: false, approval: "none", awardedPoints: null }
      : { ...cur, done: true, approval: "pending", submittedAt: new Date().toISOString() };
    setGoalRecords((prev) => ({ ...prev, [k]: merged }));
    persistRecord(empId, goal.id, taskId, merged);
  };

  // Admin un-ticking a submission — distinct from staff's own toggleTask because this notifies the employee.
  const adminUntick = (empId, goal, taskId) => {
    const task = goal.tasks.find((t) => t.id === taskId);
    const rec = getRecord(empId, goal.id, taskId);
    const k = key(empId, goal.id, taskId);
    const merged = { ...rec, done: false, approval: "none", awardedPoints: null };
    setGoalRecords((prev) => ({ ...prev, [k]: merged }));
    persistRecord(empId, goal.id, taskId, merged);
    if (task) addNotification(empId, `"${task.text}" was un-ticked by management${rec.adminRemark ? ` — ${rec.adminRemark}` : ""}`, true);
  };

  // Used for tasks that require an attachment and/or remark: staff supplies these at the same time as ticking.
  // `attachment`, if present, is { name, file } (the raw File the staff member just picked) — it gets
  // uploaded to the private task-attachments bucket here, and only the resulting storage path is what
  // actually gets saved to goalRecords/goal_records (never the file's bytes/data URL).
  const submitTaskWithDetails = async (empId, goal, taskId, { remark, attachment, noAttachmentReason }) => {
    if (isGoalLocked(goal)) return;
    const k = key(empId, goal.id, taskId);
    const cur = goalRecords[k] || defaultRecord();
    let attachmentPath = cur.attachment || null;
    if (attachment && attachment.file) {
      // Sanitize the filename (spaces/parentheses/unicode from default screenshot names can end up
      // encoded differently between the upload call and a later signed-URL lookup) and use the path
      // Supabase actually confirms it stored the file under (data.path), never our own guess at it —
      // that's what keeps what we save to goal_records.attachment_url guaranteed to match reality.
      const safeName = attachment.file.name.replace(/[^a-zA-Z0-9.\-]+/g, "-");
      const path = `${session?.companyId || "unassigned"}/${empId}/${goal.id}-${taskId}/${Date.now()}-${safeName}`;
      const { data: uploadData, error: uploadError } = await supabaseClient.storage.from("task-attachments").upload(path, attachment.file);
      if (uploadError || !uploadData?.path) {
        console.error("Failed to upload attachment:", uploadError);
        notify("Couldn't upload the attachment — please try again.");
        return;
      }
      attachmentPath = uploadData.path;
    } else if (attachment === null) {
      attachmentPath = null;
    }
    const merged = { ...cur, done: true, approval: "pending", submittedAt: new Date().toISOString(), remark, attachment: attachmentPath, noAttachmentReason };
    setGoalRecords((prev) => ({ ...prev, [k]: merged }));
    persistRecord(empId, goal.id, taskId, merged);
  };

  // Approve with (possibly partial) points. No "reject" — un-tick is the only other action.
  // Approve with (possibly partial) points. The task's CURRENT weight is frozen into the record at this
  // moment — if admin later changes the task's point value, this approved record is unaffected.
  const setApproval = (empId, goalId, taskId, awardedPoints) => {
    const goal = goals.find((g) => g.id === goalId);
    const task = goal?.tasks.find((t) => t.id === taskId);
    const rec = getRecord(empId, goalId, taskId);
    const k = key(empId, goalId, taskId);
    const merged = { ...rec, approval: "approved", awardedPoints: awardedPoints ?? rec.awardedPoints ?? 0, awardedWeight: task ? task.weight : rec.awardedWeight };
    setGoalRecords((prev) => ({ ...prev, [k]: merged }));
    persistRecord(empId, goalId, taskId, merged);
    if (task) addNotification(empId, `"${task.text}" was approved for ${awardedPoints ?? task.weight}/${task.weight} pts${rec.adminRemark ? ` — ${rec.adminRemark}` : ""}`, false);
  };

  // Staff's own remark on their submission — admin can view this but never edit it.
  const setRemark = (empId, goalId, taskId, remark) => {
    const k = key(empId, goalId, taskId);
    const cur = goalRecords[k] || defaultRecord();
    const merged = { ...cur, remark };
    setGoalRecords((prev) => ({ ...prev, [k]: merged }));
    persistRecord(empId, goalId, taskId, merged);
  };

  // Admin's own note to the staff member — separate field, never overwrites the staff's remark.
  const setAdminRemark = (empId, goalId, taskId, adminRemark) => {
    const k = key(empId, goalId, taskId);
    const cur = goalRecords[k] || defaultRecord();
    const merged = { ...cur, adminRemark };
    setGoalRecords((prev) => ({ ...prev, [k]: merged }));
    persistRecord(empId, goalId, taskId, merged);
  };

  const setAttachment = (empId, goalId, taskId, attachment) => {
    const k = key(empId, goalId, taskId);
    const cur = goalRecords[k] || defaultRecord();
    const merged = { ...cur, attachment, noAttachmentReason: attachment ? false : cur.noAttachmentReason };
    setGoalRecords((prev) => ({ ...prev, [k]: merged }));
    persistRecord(empId, goalId, taskId, merged);
  };

  const employeeGoals = (empId) => goals.filter((g) => g.active !== false && g.assignedEmployeeIds.includes(empId));

  // Every staff member's score is capped at 100 pts total, no matter how many goals they're assigned to.
  // Percentage-based scoring: task weights don't need to sum to 100.
  // percentage = (sum of awarded points) / (sum of assigned points) * 100
  // Approved tasks count toward the denominator using their FROZEN weight (as it was when approved) —
  // a later change to the task's live weight never retroactively affects an already-approved record.
  const employeePoints = (empId) => {
    const empGoalList = employeeGoals(empId);
    let awardedSum = 0, pending = 0, capacity = 0, doneCount = 0, taskCount = 0;
    empGoalList.forEach((goal) => {
      goal.tasks.forEach((t) => {
        taskCount += 1;
        const r = getRecord(empId, goal.id, t.id);
        if (r.approval === "approved") {
          const frozenWeight = r.awardedWeight ?? t.weight;
          capacity += frozenWeight;
          awardedSum += (r.awardedPoints ?? frozenWeight);
        } else {
          capacity += t.weight;
          if (r.approval === "pending") pending += t.weight;
        }
        if (r.done) doneCount += 1;
      });
    });
    const percentage = capacity > 0 ? Math.round((awardedSum / capacity) * 1000) / 10 : 0;
    return { percentage, awardedSum, pending, capacity, doneCount, taskCount };
  };

  // Completion % for ONE specific goal only (not the employee's whole scorecard) — used by reward schemes,
  // which tie a payout to a single goal's performance rather than overall standing.
  const goalCompletionForEmployee = (goal, empId) => {
    if (!goal) return 0;
    const tasks = goal.tasks;
    let awardedSum = 0, capacity = 0;
    tasks.forEach((t) => {
      const r = getRecord(empId, goal.id, t.id);
      if (r.approval === "approved") {
        const frozenWeight = r.awardedWeight ?? t.weight;
        capacity += frozenWeight;
        awardedSum += (r.awardedPoints ?? frozenWeight);
      } else {
        capacity += t.weight;
      }
    });
    return capacity > 0 ? Math.round((awardedSum / capacity) * 1000) / 10 : 0;
  };

  // Creates the goal row, its tasks, and its assignments in Supabase (in that order, since tasks/assignments
  // need the real goal id), then reflects the real DB-generated ids into local state once done.
  const addGoal = async (deptId, name, description, startDate, endDate, reviewCutoffDate, tasks, assignedEmployeeIds, opts) => {
    const isAnnual = !!(opts && opts.isAnnual);
    const isCore = !!(opts && opts.isCore);
    const reviewCutoffOffsetDays = isAnnual ? (opts.reviewCutoffOffsetDays ?? 5) : null;
    const { data: goalRow, error: goalError } = await supabaseClient.from("goals").insert({
      dept_id: deptId, name, description: description || null,
      is_team_goal: isCore, auto_assign_whole_dept: false, is_annual: isAnnual, active: true,
      start_date: startDate, end_date: endDate,
      review_cutoff_date: isAnnual ? null : reviewCutoffDate,
      review_cutoff_offset_days: reviewCutoffOffsetDays,
      // Bookkeeping for the server-side monthly rollover job — which real-world month this goal's
      // live goal_tasks/goal_assignments currently represent. The frontend itself never reads this;
      // it always treats "live" as simply today's calendar month and trusts the rollover job to have
      // kept goal_tasks/goal_assignments in sync before then.
      live_month: isAnnual ? currentIsoMonth() : null,
    }).select().single();
    if (goalError || !goalRow) { console.error("Failed to create goal:", goalError); return; }

    const taskRows = tasks.map((t, i) => ({
      goal_id: goalRow.id, text: t.text, weight: t.weight,
      requires_attachment: !!t.requiresAttachment, requires_remark: !!t.requiresRemark, sort_order: i,
    }));
    let insertedTasks = [];
    if (taskRows.length) {
      const { data, error } = await supabaseClient.from("goal_tasks").insert(taskRows).select();
      if (error) console.error("Failed to create goal tasks:", error);
      insertedTasks = data || [];
    }

    if (assignedEmployeeIds.length) {
      const { error } = await supabaseClient.from("goal_assignments").insert(
        assignedEmployeeIds.map((employeeId) => ({ goal_id: goalRow.id, employee_id: employeeId }))
      );
      if (error) console.error("Failed to create goal assignments:", error);
    }

    setGoals((prev) => [...prev, {
      id: goalRow.id, deptId, name, description: description || "", isTeamGoal: isCore, autoAssignWholeDept: false, isAnnual, active: true, startDate, endDate,
      reviewCutoffDate: isAnnual ? undefined : reviewCutoffDate,
      reviewCutoffOffsetDays: isAnnual ? reviewCutoffOffsetDays : undefined,
      tasks: insertedTasks.map((t) => ({ id: t.id, text: t.text, weight: Number(t.weight), requiresAttachment: !!t.requires_attachment, requiresRemark: !!t.requires_remark })),
      assignedEmployeeIds,
      monthlyHistory: {},
      futureVersions: [],
    }]);
  };

  // camelCase local field -> snake_case Supabase column, for the plain-patch goal fields updateGoal handles.
  const GOAL_FIELD_MAP = { name: "name", description: "description", startDate: "start_date", endDate: "end_date", reviewCutoffDate: "review_cutoff_date", reviewCutoffOffsetDays: "review_cutoff_offset_days", active: "active" };
  const updateGoal = (goalId, patch) => {
    setGoals((prev) => prev.map((g) => g.id === goalId ? { ...g, ...patch } : g));
    const dbPatch = {};
    Object.keys(patch).forEach((k) => { if (GOAL_FIELD_MAP[k]) dbPatch[GOAL_FIELD_MAP[k]] = patch[k]; });
    if (Object.keys(dbPatch).length) {
      supabaseClient.from("goals").update(dbPatch).eq("id", goalId).then(({ error }) => { if (error) console.error("Failed to update goal:", error); });
    }
  };
  // Soft delete — archived goals disappear from normal admin/staff views but stay intact for historical reports.
  const archiveGoal = (goalId) => {
    setGoals((prev) => prev.map((g) => g.id === goalId ? { ...g, active: false } : g));
    supabaseClient.from("goals").update({ active: false }).eq("id", goalId).then(({ error }) => { if (error) console.error("Failed to archive goal:", error); });
  };
  const restoreGoal = (goalId) => {
    setGoals((prev) => prev.map((g) => g.id === goalId ? { ...g, active: true } : g));
    supabaseClient.from("goals").update({ active: true }).eq("id", goalId).then(({ error }) => { if (error) console.error("Failed to restore goal:", error); });
  };
  const addTaskToGoal = async (goalId, text, weight, requiresAttachment, requiresRemark) => {
    const goal = goals.find((g) => g.id === goalId);
    const { data: taskRow, error } = await supabaseClient.from("goal_tasks").insert({
      goal_id: goalId, text, weight, requires_attachment: !!requiresAttachment, requires_remark: !!requiresRemark,
      sort_order: goal ? goal.tasks.length : 0,
    }).select().single();
    if (error || !taskRow) { console.error("Failed to add task:", error); return; }
    setGoals((prev) => prev.map((g) => g.id === goalId ? { ...g, tasks: [...g.tasks, { id: taskRow.id, text, weight, requiresAttachment: !!requiresAttachment, requiresRemark: !!requiresRemark }] } : g));
    if (goal && !isGoalLocked(goal)) goal.assignedEmployeeIds.forEach((empId) => addNotification(empId, `New task added to "${goal.name}": ${text}`, true));
  };
  const removeTaskFromGoal = (goalId, taskId) => {
    setGoals((prev) => prev.map((g) => g.id === goalId ? { ...g, tasks: g.tasks.filter((t) => t.id !== taskId) } : g));
    supabaseClient.from("goal_tasks").delete().eq("id", taskId).then(({ error }) => { if (error) console.error("Failed to remove task:", error); });
  };
  const updateTaskWeight = (goalId, taskId, weight) => {
    setGoals((prev) => prev.map((g) => g.id === goalId ? { ...g, tasks: g.tasks.map((t) => t.id === taskId ? { ...t, weight } : t) } : g));
    supabaseClient.from("goal_tasks").update({ weight }).eq("id", taskId).then(({ error }) => { if (error) console.error("Failed to update task weight:", error); });
    const goal = goals.find((g) => g.id === goalId);
    const task = goal?.tasks.find((t) => t.id === taskId);
    if (goal && task && !isGoalLocked(goal)) goal.assignedEmployeeIds.forEach((empId) => addNotification(empId, `Points changed for "${task.text}" in "${goal.name}" (now ${weight} pts)`, true));
  };
  const updateTaskRequiresAttachment = (goalId, taskId, requiresAttachment) => {
    setGoals((prev) => prev.map((g) => g.id === goalId ? { ...g, tasks: g.tasks.map((t) => t.id === taskId ? { ...t, requiresAttachment } : t) } : g));
    supabaseClient.from("goal_tasks").update({ requires_attachment: requiresAttachment }).eq("id", taskId).then(({ error }) => { if (error) console.error("Failed to update task:", error); });
  };
  const updateTaskRequiresRemark = (goalId, taskId, requiresRemark) => {
    setGoals((prev) => prev.map((g) => g.id === goalId ? { ...g, tasks: g.tasks.map((t) => t.id === taskId ? { ...t, requiresRemark } : t) } : g));
    supabaseClient.from("goal_tasks").update({ requires_remark: requiresRemark }).eq("id", taskId).then(({ error }) => { if (error) console.error("Failed to update task:", error); });
  };
  const updateTaskText = (goalId, taskId, text) => {
    setGoals((prev) => prev.map((g) => g.id === goalId ? { ...g, tasks: g.tasks.map((t) => t.id === taskId ? { ...t, text } : t) } : g));
    supabaseClient.from("goal_tasks").update({ text }).eq("id", taskId).then(({ error }) => { if (error) console.error("Failed to update task:", error); });
  };
  const toggleAssignment = (goalId, empId) => {
    const goal = goals.find((g) => g.id === goalId);
    const has = !!goal?.assignedEmployeeIds.includes(empId);
    setGoals((prev) => prev.map((g) => {
      if (g.id !== goalId) return g;
      const h = g.assignedEmployeeIds.includes(empId);
      return { ...g, assignedEmployeeIds: h ? g.assignedEmployeeIds.filter((id) => id !== empId) : [...g.assignedEmployeeIds, empId] };
    }));
    if (has) {
      supabaseClient.from("goal_assignments").delete().eq("goal_id", goalId).eq("employee_id", empId).then(({ error }) => { if (error) console.error("Failed to unassign:", error); });
    } else {
      supabaseClient.from("goal_assignments").insert({ goal_id: goalId, employee_id: empId }).then(({ error }) => { if (error) console.error("Failed to assign:", error); });
    }
  };

  // ---- Annual goal / monthly repeat helpers (pass 2) ----

  // What a goal looks like for a given month: live current-month data, a frozen past snapshot, a scheduled
  // future version, or nothing yet. Only applies to isAnnual goals — ad-hoc project goals are unaffected.
  const getMonthView = (goal, isoMonth) => {
    if (!goal.isAnnual) return { tasks: goal.tasks, assignedEmployeeIds: goal.assignedEmployeeIds, status: "n/a" };
    const cur = currentIsoMonth();
    if (isoMonth === cur) return { tasks: goal.tasks, assignedEmployeeIds: goal.assignedEmployeeIds, status: "live" };
    if (isoMonth < cur) {
      const snap = goal.monthlyHistory[isoMonth];
      return snap ? { tasks: snap.tasks, assignedEmployeeIds: snap.assignedEmployeeIds, status: "past", records: snap.records } : { tasks: [], assignedEmployeeIds: [], status: "past-empty" };
    }
    const scheduled = goal.futureVersions.find((v) => v.effectiveFromMonth === isoMonth);
    if (scheduled) return { tasks: scheduled.tasks, assignedEmployeeIds: scheduled.assignedEmployeeIds, status: "scheduled" };
    // No explicit schedule for this future month — it will inherit whatever is live/scheduled closest before it
    const priorSchedule = [...goal.futureVersions].filter((v) => v.effectiveFromMonth < isoMonth).sort((a, b) => a.effectiveFromMonth < b.effectiveFromMonth ? 1 : -1)[0];
    if (priorSchedule) return { tasks: priorSchedule.tasks, assignedEmployeeIds: priorSchedule.assignedEmployeeIds, status: "inherited" };
    return { tasks: goal.tasks, assignedEmployeeIds: goal.assignedEmployeeIds, status: "inherited" };
  };

  // Applies newTasks/newAssignedEmployeeIds to a goal's LIVE goal_tasks/goal_assignments in Supabase,
  // diffing against what's currently there so records tied to unchanged/edited tasks stay linked —
  // only genuinely new tasks get inserted, only genuinely removed tasks get deleted. Returns the local
  // tasks array with real DB ids substituted in for whatever was just inserted.
  const applyLiveGoalDefinition = async (goal, newTasks, newAssignedEmployeeIds) => {
    const oldTaskIds = new Set(goal.tasks.map((t) => t.id));
    const newTaskIds = new Set(newTasks.map((t) => t.id));
    const toDelete = goal.tasks.filter((t) => !newTaskIds.has(t.id));
    const toUpdate = newTasks.filter((t) => oldTaskIds.has(t.id));
    const toInsert = newTasks.filter((t) => !oldTaskIds.has(t.id));

    if (toDelete.length) {
      const { error } = await supabaseClient.from("goal_tasks").delete().in("id", toDelete.map((t) => t.id));
      if (error) console.error("Failed to remove tasks:", error);
    }
    for (const t of toUpdate) {
      const { error } = await supabaseClient.from("goal_tasks").update({
        text: t.text, weight: t.weight, requires_attachment: !!t.requiresAttachment, requires_remark: !!t.requiresRemark,
      }).eq("id", t.id);
      if (error) console.error("Failed to update task:", error);
    }
    let insertedTasks = [];
    if (toInsert.length) {
      const { data, error } = await supabaseClient.from("goal_tasks").insert(toInsert.map((t, i) => ({
        goal_id: goal.id, text: t.text, weight: t.weight,
        requires_attachment: !!t.requiresAttachment, requires_remark: !!t.requiresRemark, sort_order: oldTaskIds.size + i,
      }))).select();
      if (error) console.error("Failed to add tasks:", error);
      insertedTasks = data || [];
    }

    const oldAssigned = new Set(goal.assignedEmployeeIds);
    const newAssignedSet = new Set(newAssignedEmployeeIds);
    const toUnassign = [...oldAssigned].filter((id) => !newAssignedSet.has(id));
    const toAssign = [...newAssignedSet].filter((id) => !oldAssigned.has(id));
    if (toUnassign.length) {
      const { error } = await supabaseClient.from("goal_assignments").delete().eq("goal_id", goal.id).in("employee_id", toUnassign);
      if (error) console.error("Failed to unassign:", error);
    }
    if (toAssign.length) {
      const { error } = await supabaseClient.from("goal_assignments").insert(toAssign.map((employee_id) => ({ goal_id: goal.id, employee_id })));
      if (error) console.error("Failed to assign:", error);
    }

    let insertedIdx = 0;
    const finalTasks = newTasks.map((t) => oldTaskIds.has(t.id) ? t : { ...t, id: insertedTasks[insertedIdx++]?.id || t.id });
    return { tasks: finalTasks, assignedEmployeeIds: newAssignedEmployeeIds };
  };

  // Commit an edit that affects the LIVE current month. scope: "current" | "currentAndFuture"
  // Nothing is ever wiped: approved records are frozen (awardedWeight locked in at approval time,
  // immune to later edits) and pending/untouched records simply get judged against whatever the task's
  // current definition is whenever admin reviews them — their tick/remark/attachment stays intact either way.
  const commitCurrentMonthEdit = async (goalId, newTasks, newAssignedEmployeeIds, scope) => {
    const goal = goals.find((g) => g.id === goalId);
    if (!goal) return;
    const oldTasks = goal.tasks;
    const oldAssigned = goal.assignedEmployeeIds;
    const cur = currentIsoMonth();
    const nxt = nextIsoMonth(cur);

    const { tasks: finalTasks, assignedEmployeeIds: finalAssigned } = await applyLiveGoalDefinition(goal, newTasks, newAssignedEmployeeIds);

    let futureVersions = goal.futureVersions;
    if (scope === "current") {
      // one-month-only override: schedule a revert back to the old definition starting next month,
      // unless something is already explicitly scheduled from next month onward.
      const alreadyScheduledAhead = futureVersions.some((v) => v.effectiveFromMonth >= nxt);
      if (!alreadyScheduledAhead) {
        const revertEntry = { effectiveFromMonth: nxt, tasks: oldTasks, assignedEmployeeIds: oldAssigned };
        futureVersions = [...futureVersions, revertEntry];
        const { error } = await supabaseClient.from("goal_future_versions").upsert({
          goal_id: goalId, effective_from_month: nxt,
          tasks_snapshot: oldTasks.map((t) => ({ text: t.text, weight: t.weight, requiresAttachment: t.requiresAttachment, requiresRemark: t.requiresRemark })),
          assigned_snapshot: oldAssigned,
        }, { onConflict: "goal_id,effective_from_month" });
        if (error) console.error("Failed to schedule revert:", error);
      }
    }

    setGoals((prev) => prev.map((g) => g.id === goalId ? { ...g, tasks: finalTasks, assignedEmployeeIds: finalAssigned, futureVersions } : g));

    const affected = new Set([...oldAssigned, ...finalAssigned]);
    affected.forEach((empId) => addNotification(empId, `"${goal.name}" was updated for ${monthLabel(cur)} — check your goals for what changed. Anything already approved keeps its original points.`, true));
    notify(`Changes applied to ${monthLabel(cur)}${scope === "current" ? " only — reverts automatically next month" : " and every month after, until changed again"}. Approved work is unaffected.`);
  };

  // Schedule (or update) a future month's version without touching anything live. No modal/warning needed.
  const scheduleFutureVersion = (goalId, isoMonth, newTasks, newAssignedEmployeeIds) => {
    const goal = goals.find((g) => g.id === goalId);
    setGoals((prev) => prev.map((g) => {
      if (g.id !== goalId) return g;
      const existingIdx = g.futureVersions.findIndex((v) => v.effectiveFromMonth === isoMonth);
      const entry = { effectiveFromMonth: isoMonth, tasks: newTasks, assignedEmployeeIds: newAssignedEmployeeIds };
      const futureVersions = existingIdx >= 0 ? g.futureVersions.map((v, i) => i === existingIdx ? entry : v) : [...g.futureVersions, entry];
      return { ...g, futureVersions };
    }));
    supabaseClient.from("goal_future_versions").upsert({
      goal_id: goalId, effective_from_month: isoMonth,
      tasks_snapshot: newTasks.map((t) => ({ text: t.text, weight: t.weight, requiresAttachment: t.requiresAttachment, requiresRemark: t.requiresRemark })),
      assigned_snapshot: newAssignedEmployeeIds,
    }, { onConflict: "goal_id,effective_from_month" }).then(({ error }) => { if (error) console.error("Failed to schedule change:", error); });
    if (goal) newAssignedEmployeeIds.forEach((empId) => addNotification(empId, `"${goal.name}" has scheduled changes for ${monthLabel(isoMonth)}.`, false));
    notify(`Scheduled changes for ${monthLabel(isoMonth)}.`);
  };

  // Running total: sums awarded/assigned across every past month's frozen snapshot plus the live current month, for every annual goal the employee has ever been part of.
  const employeeAnnualPoints = (empId) => {
    let awardedSum = 0, capacity = 0;
    goals.filter((g) => g.isAnnual).forEach((goal) => {
      monthsInRange(goal.startDate, goal.endDate).forEach((m) => {
        const view = getMonthView(goal, m);
        if (view.status === "past" && view.assignedEmployeeIds.includes(empId)) {
          view.tasks.forEach((t) => {
            capacity += t.weight;
            const r = view.records?.[empId]?.[t.id];
            if (r && r.approval === "approved") awardedSum += (r.awardedPoints ?? t.weight);
          });
        } else if (view.status === "live" && goal.assignedEmployeeIds.includes(empId)) {
          goal.tasks.forEach((t) => {
            const r = getRecord(empId, goal.id, t.id);
            if (r.approval === "approved") {
              const frozenWeight = r.awardedWeight ?? t.weight;
              capacity += frozenWeight;
              awardedSum += (r.awardedPoints ?? frozenWeight);
            } else {
              capacity += t.weight;
            }
          });
        }
      });
    });
    return capacity > 0 ? Math.round((awardedSum / capacity) * 1000) / 10 : 0;
  };

  // Creating an employee needs a real Supabase Auth login (email+password), which the plain anon-key
  // client can never do — only the service_role key can, and that key must never reach the browser. So
  // this calls a server-side Edge Function ("create-employee") that does both the auth.users insert and
  // the employees insert atomically, using the service_role key that lives only in the function's secrets.
  const addEmployee = async (name, email, role, deptId, password, companyId) => {
    const { data, error } = await supabaseClient.functions.invoke("create-employee", {
      body: { name, email: email.trim().toLowerCase(), role: role || "staff", deptId, companyId, password: password || undefined },
    });
    if (error || !data?.employee) {
      // supabase-js only puts a generic "non-2xx status code" message on `error` itself for a
      // failed function call — the function's own detailed { error: "..." } JSON body (which is
      // what actually explains what went wrong) has to be read separately off error.context.
      let detail = data?.error || error?.message || "unknown error";
      if (error?.context && typeof error.context.json === "function") {
        try { const body = await error.context.clone().json(); if (body?.error) detail = body.error; } catch {}
      }
      console.error("Failed to create employee:", detail, error, data);
      notify(`Couldn't create ${name} — ${detail}`);
      return null;
    }
    const emp = { id: data.employee.id, name: data.employee.name, email: data.employee.email, password: null, role: data.employee.role, deptId: data.employee.dept_id, active: true };
    setEmployees((prev) => [...prev, emp]);
    // Whole-department goals (the auto-generated team scorecard) automatically pick up new hires.
    // Other core goals have their own hand-picked member list and are unaffected.
    setGoals((prev) => prev.map((g) => (g.autoAssignWholeDept && g.deptId === deptId) ? { ...g, assignedEmployeeIds: [...g.assignedEmployeeIds, emp.id] } : g));
    return emp;
  };
  const updateEmployee = (empId, patch) => {
    setEmployees((prev) => prev.map((e) => e.id === empId ? { ...e, ...patch } : e));
    const dbPatch = {};
    if (patch.name !== undefined) dbPatch.name = patch.name;
    if (patch.role !== undefined) dbPatch.role = patch.role;
    if (patch.deptId !== undefined) dbPatch.dept_id = patch.deptId;
    if (Object.keys(dbPatch).length) supabaseClient.from("employees").update(dbPatch).eq("id", empId).then(({ error }) => { if (error) console.error("Failed to update employee:", error); });
  };
  const archiveEmployee = (empId) => {
    setEmployees((prev) => prev.map((e) => e.id === empId ? { ...e, active: false } : e));
    supabaseClient.from("employees").update({ active: false }).eq("id", empId).then(({ error }) => { if (error) console.error("Failed to archive employee:", error); });
  };
  const restoreEmployee = (empId) => {
    setEmployees((prev) => prev.map((e) => e.id === empId ? { ...e, active: true } : e));
    supabaseClient.from("employees").update({ active: true }).eq("id", empId).then(({ error }) => { if (error) console.error("Failed to restore employee:", error); });
  };

  const addDepartment = async (name, colorHex, companyId) => {
    const { data, error } = await supabaseClient.from("departments").insert({ name, color_hex: colorHex, company_id: companyId, active: true }).select().single();
    if (error || !data) { console.error("Failed to create department:", error); notify(`Couldn't create department "${name}".`); return null; }
    const dept = { id: data.id, name: data.name, colorHex: data.color_hex, companyId: data.company_id, active: true };
    setDepartments((prev) => [...prev, dept]);
    return dept;
  };
  const archiveDepartment = (deptId) => {
    setDepartments((prev) => prev.map((d) => d.id === deptId ? { ...d, active: false } : d));
    supabaseClient.from("departments").update({ active: false }).eq("id", deptId).then(({ error }) => { if (error) console.error("Failed to archive department:", error); });
  };
  const restoreDepartment = (deptId) => {
    setDepartments((prev) => prev.map((d) => d.id === deptId ? { ...d, active: true } : d));
    supabaseClient.from("departments").update({ active: true }).eq("id", deptId).then(({ error }) => { if (error) console.error("Failed to restore department:", error); });
  };

  const addCompany = async (name, description) => {
    const { data, error } = await supabaseClient.from("companies").insert({ name, description: description || null, active: true }).select().single();
    if (error || !data) { console.error("Failed to create company:", error); notify(`Couldn't create company "${name}".`); return null; }
    const company = { id: data.id, name: data.name, description: data.description || "", active: true };
    setCompanies((prev) => [...prev, company]);
    return company;
  };
  const updateCompany = (companyId, patch) => {
    setCompanies((prev) => prev.map((c) => c.id === companyId ? { ...c, ...patch } : c));
    const dbPatch = {};
    if (patch.name !== undefined) dbPatch.name = patch.name;
    if (patch.description !== undefined) dbPatch.description = patch.description;
    if (Object.keys(dbPatch).length) supabaseClient.from("companies").update(dbPatch).eq("id", companyId).then(({ error }) => { if (error) console.error("Failed to update company:", error); });
  };
  const archiveCompany = (companyId) => {
    setCompanies((prev) => prev.map((c) => c.id === companyId ? { ...c, active: false } : c));
    supabaseClient.from("companies").update({ active: false }).eq("id", companyId).then(({ error }) => { if (error) console.error("Failed to archive company:", error); });
  };
  const restoreCompany = (companyId) => {
    setCompanies((prev) => prev.map((c) => c.id === companyId ? { ...c, active: true } : c));
    supabaseClient.from("companies").update({ active: true }).eq("id", companyId).then(({ error }) => { if (error) console.error("Failed to restore company:", error); });
  };

  const findEmployeeByEmail = (email) => employees.find((e) => e.email && e.email.trim().toLowerCase() === email.trim().toLowerCase());

  const addCheckin = (record) => setCheckins((prev) => [record, ...prev]);
  const addReview = (record) => setReviews((prev) => [record, ...prev]);
  const updateReview = (id, patch) => setReviews((prev) => prev.map((r) => r.id === id ? { ...r, ...patch } : r));
  const addReward = (record) => setRewards((prev) => [record, ...prev]);

  // ---- Reward schemes (preset, recurring — like a goal, but pays out based on goal performance) ----
  const addRewardScheme = (deptId, companyId, goalId, startDate, endDate, baseAmount) => {
    const scheme = {
      id: nextId("rwscheme"), deptId, companyId, goalId, startDate, endDate,
      baseAmount, active: true,
      enrolledEmployeeIds: [],
      employeeOverrides: {}, // empId -> { updateAmount, remark }
      futureBaseAmount: null, futureEffectiveMonth: null, // scheduled change, "future" scope
    };
    setRewardSchemes((prev) => [...prev, scheme]);
    return scheme;
  };
  const archiveRewardScheme = (schemeId) => setRewardSchemes((prev) => prev.map((s) => s.id === schemeId ? { ...s, active: false } : s));
  const restoreRewardScheme = (schemeId) => setRewardSchemes((prev) => prev.map((s) => s.id === schemeId ? { ...s, active: true } : s));
  const toggleRewardActive = (schemeId) => setRewardSchemes((prev) => prev.map((s) => s.id === schemeId ? { ...s, active: !s.active } : s));

  const toggleRewardEnrollment = (schemeId, empId) => setRewardSchemes((prev) => prev.map((s) => {
    if (s.id !== schemeId) return s;
    const has = s.enrolledEmployeeIds.includes(empId);
    return { ...s, enrolledEmployeeIds: has ? s.enrolledEmployeeIds.filter((id) => id !== empId) : [...s.enrolledEmployeeIds, empId] };
  }));

  const updateRewardEmployeeOverride = (schemeId, empId, patch) => setRewardSchemes((prev) => prev.map((s) => {
    if (s.id !== schemeId) return s;
    const cur = s.employeeOverrides[empId] || { updateAmount: s.baseAmount, remark: "" };
    return { ...s, employeeOverrides: { ...s.employeeOverrides, [empId]: { ...cur, ...patch } } };
  }));

  // Edit scope mirrors the goal-edit modal: "current" applies now but auto-reverts next month;
  // "currentAndFuture" applies now and stays. Nothing here ever touches already-approved goal data —
  // the scheme only controls the base amount, not the underlying task approvals.
  const commitRewardSchemeEdit = (schemeId, newBaseAmount, scope) => {
    const scheme = rewardSchemes.find((s) => s.id === schemeId);
    if (!scheme) return;
    const cur = currentIsoMonth();
    const nxt = nextIsoMonth(cur);
    setRewardSchemes((prev) => prev.map((s) => {
      if (s.id !== schemeId) return s;
      if (scope === "current") {
        return { ...s, baseAmount: newBaseAmount, futureBaseAmount: s.baseAmount, futureEffectiveMonth: nxt };
      }
      return { ...s, baseAmount: newBaseAmount, futureBaseAmount: null, futureEffectiveMonth: null };
    }));
    notify(`Reward scheme updated${scope === "current" ? " for this month only — reverts next month" : " going forward"}.`);
  };

  // Simple global toast notifications (ephemeral, bottom-right)
  const [toasts, setToasts] = useState([]);
  const notify = (message) => {
    const id = `toast-${Date.now()}-${Math.random()}`;
    setToasts((prev) => [...prev, { id, message }]);
    setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== id)), 3000);
  };

  // Persistent notifications (bell icon, per-employee inbox) — real now: loaded from Supabase for the
  // signed-in employee, kept live via a Realtime subscription (so a staff member sees a new notification
  // the instant admin approves/edits something, no refresh needed), and writes/read-state go to the DB
  // instead of disappearing on logout or on a different device.
  const [notifications, setNotifications] = useState([]);
  useEffect(() => {
    if (!session?.employeeId) { setNotifications([]); return; }
    let active = true;
    const mapRow = (n) => ({
      id: n.id, empId: n.employee_id, message: n.message,
      important: !!n.important, read: !!n.read, createdAt: n.created_at,
    });
    supabaseClient
      .from("notifications")
      .select("*")
      .eq("employee_id", session.employeeId)
      .order("created_at", { ascending: false })
      .then(({ data, error }) => {
        if (!active) return;
        if (error) { console.error("Failed to load notifications:", error); return; }
        setNotifications((data || []).map(mapRow));
      });

    const channel = supabaseClient
      .channel(`notifications-${session.employeeId}`)
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table: "notifications", filter: `employee_id=eq.${session.employeeId}` },
        (payload) => {
          const n = mapRow(payload.new);
          setNotifications((prev) => (prev.some((x) => x.id === n.id) ? prev : [n, ...prev]));
        }
      )
      .subscribe();

    return () => { active = false; supabaseClient.removeChannel(channel); };
  }, [session?.employeeId]);

  const addNotification = (empId, message, important) => {
    supabaseClient.from("notifications").insert({
      employee_id: empId, message, important: !!important, read: false,
    }).then(({ error }) => { if (error) console.error("Failed to create notification:", error); });
  };
  const markNotificationsRead = (empId) => {
    setNotifications((prev) => prev.map((n) => (n.empId === empId ? { ...n, read: true } : n)));
    supabaseClient
      .from("notifications")
      .update({ read: true })
      .eq("employee_id", empId)
      .eq("read", false)
      .then(({ error }) => { if (error) console.error("Failed to mark notifications read:", error); });
  };

  if (authLoading) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-50">
        <div className="w-8 h-8 rounded-full border-2 border-slate-300 border-t-slate-900 animate-spin" />
      </div>
    );
  }

  if (!session) {
    return (
      <div className="min-h-full bg-slate-50 font-sans">
        <style>{FONT_STYLE}</style>
        <style>{deptStylesheet(departments)}</style>
        <LoginScreen onLogin={setSession} />
      </div>
    );
  }

  if (dataLoading) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-50">
        <div className="w-8 h-8 rounded-full border-2 border-slate-300 border-t-slate-900 animate-spin" />
      </div>
    );
  }

  const sharedProps = {
    companies, addCompany, updateCompany, archiveCompany, restoreCompany,
    employees, departments, deptById, goals, getRecord, toggleTask, adminUntick, submitTaskWithDetails, setApproval, setRemark, setAdminRemark, setAttachment,
    isGoalLocked, isReviewLocked, employeeGoals, employeePoints, addGoal, updateGoal, archiveGoal, restoreGoal, addTaskToGoal, updateTaskRequiresAttachment, updateTaskRequiresRemark, updateTaskText,
    removeTaskFromGoal, updateTaskWeight, toggleAssignment, addEmployee, updateEmployee, archiveEmployee, restoreEmployee, addDepartment, archiveDepartment, restoreDepartment, checkins, addCheckin,
    reviews, addReview, updateReview, rewards, addReward, notify,
    rewardSchemes, addRewardScheme, archiveRewardScheme, restoreRewardScheme, toggleRewardActive, toggleRewardEnrollment, updateRewardEmployeeOverride, commitRewardSchemeEdit, goalCompletionForEmployee,
    getMonthView, commitCurrentMonthEdit, scheduleFutureVersion, employeeAnnualPoints,
  };

  return (
    <div className="min-h-full w-full bg-slate-50 text-slate-900 font-sans">
      <style>{FONT_STYLE}</style>
      <style>{deptStylesheet(departments)}</style>
      <TopBar session={session} onLogout={handleLogout} notifications={notifications} markNotificationsRead={markNotificationsRead} />
      {session.role === "staff" ? (
        <StaffApp session={session} {...sharedProps} />
      ) : (
        <AdminApp {...sharedProps} />
      )}
      <div className="fixed bottom-5 right-5 z-50 space-y-2">
        {toasts.map((t) => (
          <div key={t.id} className="flex items-center gap-2 bg-slate-900 text-white text-sm px-4 py-2.5 rounded-lg shadow-lg">
            <CheckCircle2 size={15} className="text-emerald-400 shrink-0" />
            {t.message}
          </div>
        ))}
      </div>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setError("");
    if (!email.trim() || !password) { setError("Enter your email and password."); return; }
    setBusy(true);
    try {
      const { data, error: authError } = await supabaseClient.auth.signInWithPassword({
        email: email.trim(),
        password,
      });
      if (authError) {
        setError(authError.message === "Invalid login credentials" ? "Incorrect email or password." : authError.message);
        setBusy(false);
        return;
      }
      const { data: emp, error: empError } = await supabaseClient
        .from("employees")
        .select("*")
        .eq("id", data.user.id)
        .single();
      if (empError || !emp) {
        setError("Signed in, but no employee record was found for this account. Ask your admin to link it.");
        await supabaseClient.auth.signOut();
        setBusy(false);
        return;
      }
      onLogin({
        role: emp.role,
        employeeId: emp.id,
        name: emp.name,
        email: emp.email,
        deptId: emp.dept_id ?? emp.department_id ?? null,
        companyId: emp.company_id ?? null,
      });
    } catch (e) {
      setError("Something went wrong signing you in. Please try again.");
      setBusy(false);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-6">
      <div className="w-full max-w-sm">
        <div className="flex items-center gap-2 mb-8 justify-center">
          <div className="w-9 h-9 rounded-lg bg-teal-600 flex items-center justify-center">
            <ClipboardList className="text-white" size={18} />
          </div>
          <span className="font-display font-semibold text-xl tracking-tight">Scorecard</span>
        </div>

        <div className="bg-white rounded-xl border border-slate-200 p-6">
          <label className="block text-xs font-medium text-slate-500 mb-1.5">Email</label>
          <input
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && submit()}
            placeholder="you@company.com"
            className="w-full px-3 py-2.5 rounded-lg border border-slate-200 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-teal-600"
          />
          <label className="block text-xs font-medium text-slate-500 mb-1.5">Password</label>
          <input
            type="password"
            value={password}
            onChange={(e) => setPassword(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && submit()}
            placeholder="••••••••"
            className="w-full px-3 py-2.5 rounded-lg border border-slate-200 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-teal-600"
          />

          {error && <p className="text-xs text-rose-500 mb-3">{error}</p>}

          <button onClick={submit} disabled={busy} className="w-full flex items-center justify-center gap-2 py-2.5 rounded-lg bg-slate-900 text-white text-sm font-medium hover:bg-slate-700 transition-colors disabled:opacity-60">
            <LogIn size={15} />
            {busy ? "Signing in…" : "Log in"}
          </button>
          <p className="text-[11px] text-slate-400 mt-3 text-center">
            Accounts are created by your admin in People management — you can't self-register.
          </p>
        </div>
      </div>
    </div>
  );
}

          <button onClick={onLogout} className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-xs font-medium text-slate-500 hover:bg-slate-100 transition-colors">

  );

function StaffAnnualGoal({ goal, employee, getRecord, toggleTask, submitTaskWithDetails, getMonthView }) {
  const cur = currentIsoMonth();
  const [selectedMonth, setSelectedMonth] = useState(cur);
  const months = monthsInRange(goal.startDate, goal.endDate);
  const view = getMonthView(goal, selectedMonth);
  const isLive = view.status === "live";
  const iAmAssignedThisMonth = view.assignedEmployeeIds.includes(employee.id);
  const theme = goalTheme(goal);

  return (
    <div className="mb-6">
      <div className={`rounded-xl px-4 py-3 mb-3 shadow-sm ${theme.bg} bg-opacity-95`}>
        <div className="flex items-center justify-between gap-3">
          <span className="flex items-center gap-1.5 text-sm font-semibold text-white">

            {goal.name}
          </span>
          <span className="flex items-center gap-1 text-[11px] font-medium text-white/90 shrink-0">
            <Calendar size={11} />
            Due date: {fmtDMY(endOfMonth(selectedMonth))}

        </div>
        <span className="text-xs text-white/80">{monthLabel(selectedMonth)}{goal.isTeamGoal ? " · core goal" : ""}</span>
      </div>

      <div className="flex gap-1 overflow-x-auto pb-2 mb-3 -mx-1 px-1">
        {months.map((m) => {
          const active = m === selectedMonth;
          const isCurM = m === cur;
          return (
            <button key={m} onClick={() => setSelectedMonth(m)} className={`shrink-0 px-2.5 py-1.5 rounded-md text-xs font-medium transition-colors ${active ? theme.bg + " text-white" : isCurM ? `${theme.light} ${theme.text}` : "text-slate-400 hover:bg-slate-50"}`}>
              {monthShortLabel(m)}
            </button>
          );
        })}
      </div>

      {!iAmAssignedThisMonth ? (
        <p className="text-xs text-slate-400 px-1">You weren't assigned to this goal in {monthLabel(selectedMonth)}.</p>
      ) : isLive ? (
        <div className="space-y-2">
          {view.tasks.map((task) => (
            <TaskRow
              key={task.id} task={task} goal={goal} employee={employee} colors={theme} locked={false}

        <div className="space-y-1.5">
